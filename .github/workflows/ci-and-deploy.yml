name: Test, Rebuild Dashboard, and Deploy

# One workflow, three ways in:
#
#   1. Push to main    -> run tests, rebuild the dashboard from the committed
#                         data, commit the built files back to main.
#   2. Schedule        -> (Milestone 8) ALSO fetch fresh games, schedule, AP/CFP
#                         polls and advanced stats from CFBD first, run the full
#                         test suite against that fresh data, then commit both
#                         the new data and the rebuilt site.
#   3. Manual run      -> same as the schedule: Actions tab -> this workflow ->
#                         "Run workflow".
#
# GitHub Pages is configured to deploy from main's root, so a commit to main is
# what publishes the site. Fetched data has to be committed too: data/raw/*.csv
# is the source of truth every rebuild starts from, so a refresh that published
# new results without committing the data would be undone by the next push.
# At most ONE commit per run, and only when something actually changed.
#
# The CFBD key lives only in the repository secret CFBD_API_KEY and is handed to
# the single fetch step; GitHub masks secret values in logs, and no script
# prints it. If the fetch fails, a test fails, or the secret is missing, the run
# stops before committing and the live site stays on its last good version.
#
# Optional repository VARIABLE (not secret) FETCH_ADVANCED_STATS=0 skips the
# advanced-stats request. Setup notes: docs/automated-refresh.md

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sunday 6 PM America/Chicago, across daylight and standard time.
    # The local-time gate makes the other UTC trigger a no-op.
    - cron: "0 23 * * 0"
    - cron: "0 0 * * 1"
    # Thursday-night ratings refresh remains on its established schedule.
    - cron: "15 4 * * 5"
    # Final scores move from the live snapshot to History during game windows.
    # These UTC slots span Thursday evening through Sunday night in Central time.
    # August through January: the regular season plus conference championships,
    # bowls and the playoff, which are the games most worth updating promptly.
    - cron: "35 * * 1,8-12 5,6,0,1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Bootstrap a test database
        run: |
          python3 src/bootstrap_league_db.py \
            --backup db/league_backup_before_playoff_migration.db \
            --out db/league.db
          for year in $(seq 1980 $(date +%Y)); do
            if [ -f "data/raw/games_${year}.csv" ]; then
              python3 src/load_games.py "data/raw/games_${year}.csv"
            fi
          done
          python3 src/patch_known_membership_gaps.py --db db/league.db
          for f in data/raw/membership_*.csv; do
            [ -e "$f" ] || continue
            year=$(basename "$f" .csv | sed 's/membership_//')
            python3 src/load_membership_snapshot.py "$f" --db db/league.db --year "$year"
          done
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('db/league.db')
          conn.executescript(open('sql/standings_tables.sql').read())
          conn.executescript(open('sql/views/v_games_enriched.sql').read())
          conn.commit()
          "
          # PER-GAME advanced stats (EXP-03). This is the one optional load the test
          # job cannot skip: it is model INPUT, so without it build_elo.py sends
          # every game down the MOV fallback and this job tests a set of ratings
          # that nothing in production would ever produce. Season-level advanced
          # stats are still left out, being display data no model reads.
          for f in data/raw/game_advanced_*.csv; do
            [ -e "$f" ] || continue
            python3 src/load_game_advanced.py "$f" --db db/league.db
          done
          python3 src/build_coefficients.py
          for year in 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            python3 src/coefficients/compute_conference_team_records.py --year "$year" --no-validation
            python3 src/coefficients/derive_conference_standings_local.py --year "$year"
          done
          # Build Elo + hybrid tables so real-data invariant tests run instead of skipping.
          # Fit the xSRDiff expectation curve first: it is model input, and without
          # it build_elo.py sends every game down its MOV fallback, so the tests
          # that check the configured layer actually fires would pass on a build
          # that never ran the layer.
          python3 src/fit_xsrdiff.py || echo "xSRDiff curve not fitted; Elo will use its configured fallback."
          python3 src/build_elo.py
          # Team-specific HFA (analysis only -- production Elo keeps its flat
          # elo.home_field). Runs AFTER build_elo.py because every estimate reads
          # pregame ratings out of elo_game_history. The FULL build here, not
          # --current-only: team_hfa_by_season is what makes the point-in-time
          # test run on the real database instead of skipping.
          python3 src/build_hfa.py
          python3 src/build_hybrid_coefficients.py
          python3 src/build_conference_coe2.py
          python3 src/build_coe2_rollups.py

      - name: Run tests
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test dashboard navigation and search
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test

  rebuild-and-deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never let two runs (e.g. a push and a scheduled refresh) build and push at once.
    concurrency:
      group: rebuild-and-deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same packages as the test job. Without this, any pipeline step that
      # imports a third-party package fails here even though tests pass.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Gate Sunday refresh to 6 PM Central
        id: sunday_time
        if: >-
          github.event_name == 'schedule' &&
          (github.event.schedule == '0 23 * * 0' || github.event.schedule == '0 0 * * 1')
        env:
          TRIGGER: ${{ github.event.schedule }}
        run: |
          # Pick the UTC cron for 6 PM Central on this Sunday. Do not require
          # the runner to start at exactly 6 PM; GitHub can delay scheduled jobs.
          if [ "$(TZ=America/Chicago date +%z)" = "-0500" ]; then
            expected='0 23 * * 0'
          else
            expected='0 0 * * 1'
          fi
          if [ "$TRIGGER" != "$expected" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This UTC trigger is not the 6 PM Central slot."
          fi

      - name: Detect live finals missing from model inputs
        if: github.event_name == 'push' || github.event.schedule == '35 * * 1,8-12 5,6,0,1'
        id: freshness
        run: |
          # The v0.1 stadium pages need the venue catalog even if no new game
          # has ended since the last model refresh. Fetch it on first publish.
          if [ ! -s data/raw/venues.json ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=$(python3 src/model_refresh_needed.py)" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch fresh data from CFBD (scheduled, manual, or stale push)
        if: steps.sunday_time.outputs.skip != 'true' && (github.event_name != 'push' && github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBD_FETCH_ADVANCED: ${{ vars.FETCH_ADVANCED_STATS || '1' }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "::error::Repository secret CFBD_API_KEY is not set (Settings > Secrets and variables > Actions). Nothing was changed."
            exit 1
          fi
          SEASON=$(python3 src/current_season.py)
          echo "Refreshing season $SEASON"
          python3 src/fetch_cfbd_games.py "$SEASON"
          # Per-game advanced stats (EXP-03). This is model input, not display
          # data: the xSRDiff performance layer reads Success Rate from it. A
          # failed fetch only warns and keeps the existing file, so the rebuild
          # still succeeds with whatever coverage is already committed.
          python3 src/fetch_cfbd_game_advanced.py "$SEASON"
          # Preserve the weekly player lines after the live slate rolls over.
          # A temporary CFBD failure leaves the last complete archive intact.
          python3 src/fetch_cfbd_players.py "$SEASON" || echo "Player archive unavailable; retry next refresh."

      # The catalog only enriches stadiums with CFBD ids and coordinates.
      # build_stadiums.py's import_venue_catalog() returns zero counts when the
      # file is absent, so the seed, game-venue resolution and every other page
      # still build. Warn and carry on rather than failing the deploy: a missing
      # venue catalog must not stop the live scoreboard from publishing.
      - name: Check for a stadium venue catalog
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: |
          if [ ! -s data/raw/venues.json ]; then
            echo "::warning::Stadium venue catalog is missing, so venue imports are skipped and the Stadium Explorer map will have no coordinates. Check CFBD venue access."
          fi

      - name: Run full pipeline (bootstrap, load, ratings, standings)
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: python3 run_pipeline.py --force

      - name: Build Elo, hybrid, and conference CoE 2.0 tables
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: |
          # Refit the xSRDiff expectation curve BEFORE Elo, so the new season is
          # valued by a curve that includes it in its walk-forward history. A
          # no-op (and a clean skip) until per-game Success Rate has been loaded.
          python3 src/fit_xsrdiff.py || echo "xSRDiff curve not fitted; Elo will use its configured fallback."
          python3 src/build_elo.py
          # Current team HFA evidence depends on this newly rebuilt Elo history.
          # Display-only; production Elo continues to use its flat bonus. The
          # dashboard reads only the current estimates, so this stays
          # --current-only; the full historical rebuild runs in the test job.
          python3 src/build_hfa.py --current-only
          python3 src/build_hybrid_coefficients.py
          python3 src/build_conference_coe2.py
          # Season rollups + explicit bonuses, and the conference five-season
          # (entering) value. Depends on the game awards above.
          python3 src/build_coe2_rollups.py

      # Both of these read the rebuilt database and write a file under
      # data/processed/, which the commit step below persists. They belong to
      # this job, not the test job: the test job's bootstrap has no
      # scheduled_games table, and anything it wrote would be thrown away.
      - name: Record and score frozen HFA shadow forecasts
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: python3 src/track_hfa_shadow.py

      - name: Audit game, efficiency, venue, and player coverage
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: python3 src/audit_game_coverage.py

      # MODEL-07. Scores the ratings that were just built and writes
      # data/processed/validation_report.json + validation_by_season.csv, which
      # the commit step below picks up -- so every refresh leaves a dated record
      # of how well the model predicted, instead of that being knowable only by
      # running a script locally. Reads the database, writes nothing to it and
      # never touches config, so it cannot change the site it reports on.
      - name: Score the model and write the validation report
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: python3 src/run_validation.py

      - name: Rebuild the dashboard
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: python3 build_dashboard.py --draw-seed 1

      # A stale push can fetch new data too, so retest whenever the feed ran.
      - name: Test the freshly fetched data before publishing
        if: steps.sunday_time.outputs.skip != 'true' && (github.event_name != 'push' && github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: pytest -q

      - name: Commit and push if anything actually changed
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        env:
          EVENT: ${{ github.event_name }}
          FRESH: ${{ steps.freshness.outputs.needed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ ui/dashboard.html ui/dashboard_data.json ui/data/ ui/assets/ ui/logo_manifest.json data/processed/
          if git diff --staged --quiet; then
            echo "Nothing changed; no commit."
            exit 0
          fi
          if [ "$EVENT" = "push" ] && [ "$FRESH" = "true" ]; then
            git commit -m "Refresh model from newer live finals [skip ci]"
          elif [ "$EVENT" = "push" ]; then
            git commit -m "Auto-rebuild dashboard [skip ci]"
          else
            git commit -m "Scheduled data refresh: season $(python3 src/current_season.py) [skip ci]"
          fi
          # If you pushed while this ran, replay this commit on top of yours rather than failing.
          git pull --rebase origin main
          git push origin HEAD:main
