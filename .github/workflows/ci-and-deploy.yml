name: Test, Rebuild Dashboard, and Deploy

# One workflow, three ways in:
#
#   1. Push to main    -> run tests, rebuild the dashboard from the committed
#                         data, commit the built files back to main.
#   2. Schedule        -> (Milestone 8) ALSO fetch fresh games, schedule, AP/CFP
#                         polls and advanced stats from CFBD first, run the full
#                         test suite against that fresh data, then commit both
#                         the new data and the rebuilt site.
#   3. Manual run      -> same as the schedule: Actions tab -> this workflow ->
#                         "Run workflow".
#
# GitHub Pages is configured to deploy from main's root, so a commit to main is
# what publishes the site. Fetched data has to be committed too: data/raw/*.csv
# is the source of truth every rebuild starts from, so a refresh that published
# new results without committing the data would be undone by the next push.
# At most ONE commit per run, and only when something actually changed.
#
# The CFBD key lives only in the repository secret CFBD_API_KEY and is handed to
# the single fetch step; GitHub masks secret values in logs, and no script
# prints it. If the fetch fails, a test fails, or the secret is missing, the run
# stops before committing and the live site stays on its last good version.
#
# Optional repository VARIABLE (not secret) FETCH_ADVANCED_STATS=0 skips the
# advanced-stats request. Setup notes: docs/automated-refresh.md

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Times are UTC. Edit these two lines to change the refresh schedule.
    #   Sunday 20:00 UTC (3 PM Central): after Saturday's games AND the AP poll's Sunday release.
    #   Wednesday 12:00 UTC (7 AM Central): picks up Tuesday-night CFP rankings and midweek games.
    - cron: "0 20 * * 0"
    - cron: "0 12 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Bootstrap a test database
        run: |
          python3 src/bootstrap_league_db.py \
            --backup db/league_backup_before_playoff_migration.db \
            --out db/league.db
          for year in $(seq 1980 $(date +%Y)); do
            if [ -f "data/raw/games_${year}.csv" ]; then
              python3 src/load_games.py "data/raw/games_${year}.csv"
            fi
          done
          python3 src/patch_known_membership_gaps.py --db db/league.db
          for f in data/raw/membership_*.csv; do
            [ -e "$f" ] || continue
            year=$(basename "$f" .csv | sed 's/membership_//')
            python3 src/load_membership_snapshot.py "$f" --db db/league.db --year "$year"
          done
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('db/league.db')
          conn.executescript(open('sql/standings_tables.sql').read())
          conn.executescript(open('sql/views/v_games_enriched.sql').read())
          conn.commit()
          "
          python3 src/build_coefficients.py
          for year in 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            python3 src/coefficients/compute_conference_team_records.py --year "$year" --no-validation
            python3 src/coefficients/derive_conference_standings_local.py --year "$year"
          done
          # Build Elo + hybrid tables so real-data invariant tests run instead of skipping.
          python3 src/build_elo.py
          python3 src/build_hybrid_coefficients.py

      - name: Run tests
        run: pytest -v

  rebuild-and-deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never let two runs (e.g. a push and a scheduled refresh) build and push at once.
    concurrency:
      group: rebuild-and-deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same packages as the test job. Without this, any pipeline step that
      # imports a third-party package fails here even though tests pass.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Fetch fresh data from CFBD (scheduled and manual runs only)
        if: github.event_name != 'push'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBD_FETCH_ADVANCED: ${{ vars.FETCH_ADVANCED_STATS || '1' }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "::error::Repository secret CFBD_API_KEY is not set (Settings > Secrets and variables > Actions). Nothing was changed."
            exit 1
          fi
          SEASON=$(python3 src/current_season.py)
          echo "Refreshing season $SEASON"
          python3 src/fetch_cfbd_games.py "$SEASON"

      - name: Run full pipeline (bootstrap, load, ratings, standings)
        run: python3 run_pipeline.py --force

      - name: Build Elo, hybrid, and conference CoE 2.0 tables
        run: |
          python3 src/build_elo.py
          python3 src/build_hybrid_coefficients.py
          python3 src/build_conference_coe2.py

      - name: Rebuild the dashboard
        run: python3 build_dashboard.py --draw-seed 1

      # Pushes were already tested by the `test` job against the committed data.
      # Scheduled/manual runs just fetched NEW data, so test that before publishing.
      - name: Test the freshly fetched data before publishing (scheduled and manual runs only)
        if: github.event_name != 'push'
        run: pytest -q

      - name: Commit and push if anything actually changed
        env:
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ ui/dashboard.html ui/dashboard_data.json ui/data/ ui/assets/ ui/logo_manifest.json data/processed/
          if git diff --staged --quiet; then
            echo "Nothing changed; no commit."
            exit 0
          fi
          if [ "$EVENT" = "push" ]; then
            git commit -m "Auto-rebuild dashboard [skip ci]"
          else
            git commit -m "Scheduled data refresh: season $(python3 src/current_season.py) [skip ci]"
          fi
          # If you pushed while this ran, replay this commit on top of yours rather than failing.
          git pull --rebase origin main
          git push origin HEAD:main
