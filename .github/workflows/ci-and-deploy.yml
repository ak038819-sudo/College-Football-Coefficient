name: Test, Rebuild Dashboard, and Deploy

# One workflow, three ways in:
#
#   1. Push to main    -> run tests, rebuild the dashboard from the committed
#                         data, commit the built files back to main.
#   2. Schedule        -> (Milestone 8) ALSO fetch fresh games, schedule, AP/CFP
#                         polls and advanced stats from CFBD first, run the full
#                         test suite against that fresh data, then commit both
#                         the new data and the rebuilt site.
#   3. Manual run      -> same as the schedule: Actions tab -> this workflow ->
#                         "Run workflow".
#
# GitHub Pages is configured to deploy from main's root, so a commit to main is
# what publishes the site. Fetched data has to be committed too: data/raw/*.csv
# is the source of truth every rebuild starts from, so a refresh that published
# new results without committing the data would be undone by the next push.
# At most ONE commit per run, and only when something actually changed.
#
# The CFBD key lives only in the repository secret CFBD_API_KEY and is handed to
# the single fetch step; GitHub masks secret values in logs, and no script
# prints it. If the fetch fails, a test fails, or the secret is missing, the run
# stops before committing and the live site stays on its last good version.
#
# Optional repository VARIABLE (not secret) FETCH_ADVANCED_STATS=0 skips the
# advanced-stats request. Setup notes: docs/automated-refresh.md

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sunday 6 PM America/Chicago, across daylight and standard time.
    # The local-time gate makes the other UTC trigger a no-op.
    - cron: "0 23 * * 0"
    - cron: "0 0 * * 1"
    # Thursday-night ratings refresh remains on its established schedule.
    - cron: "15 4 * * 5"
    # Final scores move from the live snapshot to History during game windows.
    # These UTC slots span Thursday evening through Sunday night in Central time.
    # August through January: the regular season plus conference championships,
    # bowls and the playoff, which are the games most worth updating promptly.
    - cron: "35 * * 1,8-12 5,6,0,1"
  workflow_dispatch: {}
  # Source jobs use GITHUB_TOKEN and [skip ci]; their commits cannot trigger push CI.
  # Completion queues a rebuild even if some seasons committed before a failure.
  workflow_run:
    workflows: [Backfill player box scores, Sync rosters and coaches]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pages: write
  # The alert jobs below keep one issue as this pipeline's health light.
  issues: write

jobs:
  test:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Bootstrap a test database
        run: |
          python3 src/bootstrap_league_db.py \
            --backup db/league_backup_before_playoff_migration.db \
            --out db/league.db
          for year in $(seq 1980 $(date +%Y)); do
            if [ -f "data/raw/games_${year}.csv" ]; then
              python3 src/load_games.py "data/raw/games_${year}.csv"
            fi
          done
          # Games against opponents this project holds no rating for, and
          # games not yet played. Both live in their own tables that no rating
          # engine reads, and run_pipeline.py -- which is what the deploy job
          # runs -- loads both. Without them this job tested a database the
          # deploy would never produce: no scheduled_games meant the
          # rest-of-season projection had nothing left to project, and no
          # non_fbs_games meant the record a team page shows did not exist.
          for f in data/raw/fcs_games_*.csv; do
            [ -e "$f" ] || continue
            year=$(basename "$f" .csv | sed 's/fcs_games_//')
            python3 src/load_fcs_games.py "$year" --db db/league.db --csv "$f"
          done
          for f in data/raw/schedule_*.csv; do
            [ -e "$f" ] || continue
            python3 src/load_schedule.py "$f" --db db/league.db
          done
          python3 src/patch_known_membership_gaps.py --db db/league.db
          for f in data/raw/membership_*.csv; do
            [ -e "$f" ] || continue
            year=$(basename "$f" .csv | sed 's/membership_//')
            python3 src/load_membership_snapshot.py "$f" --db db/league.db --year "$year"
          done
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('db/league.db')
          conn.executescript(open('sql/standings_tables.sql').read())
          conn.executescript(open('sql/views/v_games_enriched.sql').read())
          conn.commit()
          "
          # PER-GAME advanced stats (EXP-03). This is the one optional load the test
          # job cannot skip: it is model INPUT, so without it build_elo.py sends
          # every game down the MOV fallback and this job tests a set of ratings
          # that nothing in production would ever produce. Season-level advanced
          # stats are still left out, being display data no model reads.
          for f in data/raw/game_advanced_*.csv; do
            [ -e "$f" ] || continue
            python3 src/load_game_advanced.py "$f" --db db/league.db
          done
          python3 src/build_coefficients.py
          for year in 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            python3 src/coefficients/compute_conference_team_records.py --year "$year" --no-validation
            python3 src/coefficients/derive_conference_standings_local.py --year "$year"
          done
          # Build Elo + hybrid tables so real-data invariant tests run instead of skipping.
          # Fit the xSRDiff expectation curve first: it is model input, and without
          # it build_elo.py sends every game down its MOV fallback, so the tests
          # that check the configured layer actually fires would pass on a build
          # that never ran the layer.
          python3 src/fit_xsrdiff.py || echo "xSRDiff curve not fitted; Elo will use its configured fallback."
          python3 src/build_elo.py
          # Team-specific HFA (analysis only -- production Elo keeps its flat
          # elo.home_field). Runs AFTER build_elo.py because every estimate reads
          # pregame ratings out of elo_game_history. The FULL build here, not
          # --current-only: team_hfa_by_season is what makes the point-in-time
          # test run on the real database instead of skipping.
          python3 src/build_hfa.py
          python3 src/build_hybrid_coefficients.py
          python3 src/build_conference_coe2.py
          python3 src/build_coe2_rollups.py

      - name: Run tests
        run: pytest -v

      # Draft PR #161: audit the real committed CFBD per-game data loaded above.
      # PR runs never reach the production deployment job (main-only gate).
      - name: Audit matchup data coverage (2025-2026)
        if: github.event_name == 'pull_request'
        run: |
          python3 src/audit_matchup_coverage.py --db db/league.db --season 2025
          python3 src/audit_matchup_coverage.py --db db/league.db --season 2026
          python3 src/validate_matchup_intelligence.py --db db/league.db --season 2025 --metric success_rate
          python3 src/validate_matchup_intelligence.py --db db/league.db --season 2026 --metric success_rate

      # Research-only data artifact for the UI design handoff. Never published.
      - name: Build offline scouting contract samples
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/elocast-scouting
          python3 src/export_matchup_scouting.py --db db/league.db --season 2025 --as-of 2025-11-01 --out /tmp/elocast-scouting/2025-weekly-snapshot.json
          python3 src/export_matchup_scouting.py --db db/league.db --season 2026 --as-of 2026-10-31 --out /tmp/elocast-scouting/2026-weekly-snapshot.json

      - name: Attach scouting research samples
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: matchup-scouting-contract
          path: /tmp/elocast-scouting/*.json
          retention-days: 7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Required on main too: the shared dashboard test expects real scouting assets.
      - name: Generate verified descriptive scouting UI assets
        run: |
          python3 src/export_descriptive_site_assets.py --db db/league.db
          python3 build_dashboard.py --reuse-exports

      - name: Test dashboard navigation and search
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test

      - name: Capture Modern responsive team-page screenshots
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/elocast-visual-qa
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/elocast-visual-server.log 2>&1 &
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME"
          # Chrome renders the page, writes the PNG, and then does not always
          # exit: under --virtual-time-budget, virtual time is paused while a
          # request is outstanding, so one that never settles holds the budget
          # open and `timeout` kills the process at the limit. Tolerate exactly
          # that status (124), because by then the screenshot has been written;
          # any other non-zero status is a real Chrome failure and still fails
          # the step, as does a missing or empty PNG. What this step has always
          # proved is that each viewport loads and screenshots -- it does not
          # compare pixels, and tolerating 124 does not change that.
          for width in 390 768 1280; do
            for view in overview analytics; do
              timeout 45 "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size="${width},900" --virtual-time-budget=12000 --screenshot="/tmp/elocast-visual-qa/byu-${view}-${width}.png" "http://127.0.0.1:8765/ui/dashboard.html#team=byu&tab=${view}" || [ $? -eq 124 ]
              test -s "/tmp/elocast-visual-qa/byu-${view}-${width}.png"
            done
          done
          timeout 60 "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size="390,2200" --virtual-time-budget=12000 --screenshot="/tmp/elocast-visual-qa/byu-analytics-390-long.png" "http://127.0.0.1:8765/ui/dashboard.html#team=byu&tab=analytics" || [ $? -eq 124 ]
          test -s "/tmp/elocast-visual-qa/byu-analytics-390-long.png"
      - name: Upload Modern visual QA screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: elocast-modern-team-browser-qa
          path: /tmp/elocast-visual-qa/*.png
          retention-days: 7
          if-no-files-found: warn

  rebuild-and-deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never let two runs (e.g. a push and a scheduled refresh) build and push at once.
    concurrency:
      group: rebuild-and-deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # actions/checkout pins the commit that TRIGGERED the run, and the
      # concurrency lock above means a queued run can sit for several minutes
      # behind one that publishes. It then rebuilt a site from a base main had
      # already left, and every generated file it produced disagreed with the
      # published one -- which is what turned run 37172187197 into twenty
      # conflicts. Build from the tip instead; the tests that gated this run
      # already ran against the triggering commit.
      - name: Build from the current tip of main
        run: |
          if ! git fetch origin main; then
            echo "::error::Could not fetch origin/main."
            exit 1
          fi
          if ! git reset --hard FETCH_HEAD; then
            echo "::error::Could not move the working tree to the tip of main."
            exit 1
          fi
          echo "Building from $(git log -1 --oneline)"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Same packages as the test job. Without this, any pipeline step that
      # imports a third-party package fails here even though tests pass.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Gate Sunday refresh to 6 PM Central
        id: sunday_time
        if: >-
          github.event_name == 'schedule' &&
          (github.event.schedule == '0 23 * * 0' || github.event.schedule == '0 0 * * 1')
        env:
          TRIGGER: ${{ github.event.schedule }}
        run: |
          # Pick the UTC cron for 6 PM Central on this Sunday. Do not require
          # the runner to start at exactly 6 PM; GitHub can delay scheduled jobs.
          if [ "$(TZ=America/Chicago date +%z)" = "-0500" ]; then
            expected='0 23 * * 0'
          else
            expected='0 0 * * 1'
          fi
          if [ "$TRIGGER" != "$expected" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This UTC trigger is not the 6 PM Central slot."
          fi

      - name: Detect live finals missing from model inputs
        if: github.event_name == 'push' || github.event.schedule == '35 * * 1,8-12 5,6,0,1'
        id: freshness
        run: |
          # The v0.1 stadium pages need the venue catalog even if no new game
          # has ended since the last model refresh. Fetch it on first publish.
          if [ ! -s data/raw/venues.json ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=$(python3 src/model_refresh_needed.py)" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch fresh data from CFBD (scheduled, manual, or stale push)
        if: github.event_name != 'workflow_run' && steps.sunday_time.outputs.skip != 'true' && (github.event_name != 'push' && github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBD_FETCH_ADVANCED: ${{ vars.FETCH_ADVANCED_STATS || '1' }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "::error::Repository secret CFBD_API_KEY is not set (Settings > Secrets and variables > Actions). Nothing was changed."
            exit 1
          fi
          SEASON=$(python3 src/current_season.py)
          echo "Refreshing season $SEASON"
          python3 src/fetch_cfbd_games.py "$SEASON"
          # Per-game advanced stats (EXP-03). This is model input, not display
          # data: the xSRDiff performance layer reads Success Rate from it. A
          # failed fetch only warns and keeps the existing file, so the rebuild
          # still succeeds with whatever coverage is already committed.
          python3 src/fetch_cfbd_game_advanced.py "$SEASON"
          # Preserve the weekly player lines after the live slate rolls over.
          # A temporary CFBD failure leaves the last complete archive intact.
          python3 src/fetch_cfbd_players.py "$SEASON" || echo "Player archive unavailable; retry next refresh."
          # Betting lines for the current season, re-fetched beside the games
          # so the two stay consistent. CFBD serves the CLOSING line for a game
          # once it is final and the current number before kickoff, so without
          # this a line captured weeks early would be scored as that game's
          # close the moment it was played. The measurement also refuses any
          # snapshot taken before the game ended, so a failed fetch here costs
          # coverage of the newest finals rather than publishing a stale line.
          python3 src/fetch_cfbd_lines.py "$SEASON" || echo "Line archive unavailable; retry next refresh."

      # The catalog only enriches stadiums with CFBD ids and coordinates.
      # build_stadiums.py's import_venue_catalog() returns zero counts when the
      # file is absent, so the seed, game-venue resolution and every other page
      # still build. Warn and carry on rather than failing the deploy: a missing
      # venue catalog must not stop the live scoreboard from publishing.
      - name: Check for a stadium venue catalog
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: |
          if [ ! -s data/raw/venues.json ]; then
            echo "::warning::Stadium venue catalog is missing, so venue imports are skipped and the Stadium Explorer map will have no coordinates. Check CFBD venue access."
          fi

      - name: Run full pipeline (bootstrap, load, ratings, standings)
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: python3 run_pipeline.py --force

      - name: Build Elo, hybrid, and conference CoE 2.0 tables
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: |
          # Refit the xSRDiff expectation curve BEFORE Elo, so the new season is
          # valued by a curve that includes it in its walk-forward history. A
          # no-op (and a clean skip) until per-game Success Rate has been loaded.
          python3 src/fit_xsrdiff.py || echo "xSRDiff curve not fitted; Elo will use its configured fallback."
          python3 src/build_elo.py
          # Current team HFA evidence depends on this newly rebuilt Elo history.
          # Display-only; production Elo continues to use its flat bonus. The
          # dashboard reads only the current estimates, so this stays
          # --current-only; the full historical rebuild runs in the test job.
          python3 src/build_hfa.py --current-only
          python3 src/build_hybrid_coefficients.py
          python3 src/build_conference_coe2.py
          # Season rollups + explicit bonuses, and the conference five-season
          # (entering) value. Depends on the game awards above.
          python3 src/build_coe2_rollups.py

      # Both of these read the rebuilt database and write a file under
      # data/processed/, which the commit step below persists. They belong to
      # this job, not the test job: the test job's bootstrap has no
      # scheduled_games table, and anything it wrote would be thrown away.
      - name: Record and score frozen HFA shadow forecasts
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: python3 src/track_hfa_shadow.py

      - name: Audit game, efficiency, venue, and player coverage
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: python3 src/audit_game_coverage.py

      # MODEL-07. Scores the ratings that were just built and writes
      # data/processed/validation_report.json + validation_by_season.csv, which
      # the commit step below picks up -- so every refresh leaves a dated record
      # of how well the model predicted, instead of that being knowable only by
      # running a script locally. Reads the database, writes nothing to it and
      # never touches config, so it cannot change the site it reports on.
      - name: Score the model and write the validation report
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: python3 src/run_validation.py

      - name: Rebuild the dashboard
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: python3 build_dashboard.py --draw-seed 1

      # The production render must actually run. PR-only --reuse-exports checks
      # previously missed a literal backslash-n commenting out this path.
      - name: Verify the generated production dashboard contains The Modern
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("ui/dashboard.html").read_text(encoding="utf-8")
          for marker in ('team-modern.css?v=', 'renderModernRadar',
                         'Opponent-adjusted scouting'):
              if marker not in html:
                  raise SystemExit(f"Production dashboard is missing Modern marker: {marker}")
          if '__SCOUTING_VERSIONS__' in html:
              raise SystemExit("Unresolved scouting version placeholder")
          for year in (2025, 2026):
              path = Path(f"ui/data/scouting/{year}.js")
              if not path.is_file() or path.stat().st_size < 100:
                  raise SystemExit(f"Missing production scouting asset: {path}")
          print("Generated Modern team pages and data-bound scouting assets: OK")
          PY

      # A stale push can fetch new data too, so retest whenever the feed ran.
      - name: Test the freshly fetched data before publishing
        if: github.event_name != 'workflow_run' && steps.sunday_time.outputs.skip != 'true' && (github.event_name != 'push' && github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        run: pytest -q

      - name: Commit and push if anything actually changed
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        env:
          EVENT: ${{ github.event_name }}
          FRESH: ${{ steps.freshness.outputs.needed }}
        run: |
          if [ "$EVENT" = "push" ] && [ "$FRESH" = "true" ]; then
            MESSAGE="Refresh model from newer live finals [skip ci]"
          elif [ "$EVENT" = "push" ]; then
            MESSAGE="Auto-rebuild dashboard [skip ci]"
          else
            MESSAGE="Scheduled data refresh: season $(python3 src/current_season.py) [skip ci]"
          fi
          # Merges rather than rebases a push that landed while this built, and
          # keeps this run's freshly generated files where both sides wrote one.
          # See the header of the script for why a rebase cannot work here.
          scripts/publish_to_main.sh "$MESSAGE" \
            data/raw/ ui/dashboard.html ui/dashboard_data.json ui/data/ \
            ui/assets/ ui/logo_manifest.json data/processed/

      # GitHub Pages is configured for main/(root). A push made by GITHUB_TOKEN
      # does not trigger the branch-based Pages build; request it explicitly
      # after all generated assets have been pushed to main successfully.
      - name: Publish committed dashboard to GitHub Pages
        if: steps.sunday_time.outputs.skip != 'true' && (github.event.schedule != '35 * * 1,8-12 5,6,0,1' || steps.freshness.outputs.needed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONFIG="$(gh api "repos/$GITHUB_REPOSITORY/pages")"
          SOURCE="$(printf '%s' "$CONFIG" | python3 -c 'import sys,json; d=json.load(sys.stdin); s=d.get("source") or {}; print(s.get("branch","")+":"+s.get("path",""))')"
          BUILD_TYPE="$(printf '%s' "$CONFIG" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("build_type",""))')"
          echo "Pages source: $SOURCE; build type: $BUILD_TYPE"
          if [ "$SOURCE" != "main:/" ]; then
            echo "::error::Pages does not point to main/(root), expected by the publishing pipeline."
            exit 1
          fi
          if [ "$BUILD_TYPE" = "workflow" ]; then
            echo "::error::Pages is configured for Actions deployment, not legacy branch builds. Explicit deploy-pages is needed."
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          echo "Explicit GitHub Pages build requested from the latest main commit."

  # A scheduled failure here is invisible: nothing publishes while the test
  # job is red, and the only place that shows is the Actions tab. Six runs
  # failed between 2026-10-09 06:31 and 2026-10-10 00:13 UTC and no ratings
  # refresh reached the site for four days. These two jobs keep ONE issue
  # open for as long as main cannot publish, and close it when it can.
  #
  # Pull requests are deliberately excluded: a failing PR already shows its
  # own red check to the person who pushed it.
  alert-failure:
    needs: [test, rebuild-and-deploy]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (needs.test.result == 'failure' || needs.rebuild-and-deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Flag the pipeline as failing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/alert_pipeline_state.py --state failed \
            --branch "${GITHUB_REF_NAME}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  alert-recovery:
    needs: [test, rebuild-and-deploy]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.test.result == 'success' &&
      needs.rebuild-and-deploy.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Clear the flag if one is set
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/alert_pipeline_state.py --state recovered \
            --branch "${GITHUB_REF_NAME}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
