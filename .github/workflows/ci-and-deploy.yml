name: Test, Rebuild Dashboard, and Deploy

# Runs the test suite on every push and PR (as a gate). On a push to
# main specifically, ALSO rebuilds the dashboard from whatever source
# data is currently committed (data/raw/*.csv, sql/*, ui/team_logos/*,
# etc.) and commits the result back to main -- which GitHub Pages
# (already configured to deploy from main's root) then picks up
# automatically within a minute or two, with no separate deploy step
# needed here.
#
# This never re-fetches from the CFBD API itself -- that stays a manual
# step you run locally (needs your API key as a secret, which isn't
# set up here). The current season's conference membership specifically
# only comes from that live fetch, so it's captured as a committed
# data/raw/membership_<year>.csv snapshot (see
# export_membership_snapshot.py) -- run that after fetching fresh
# membership locally, commit the CSV, and both this workflow and any
# fresh --force rebuild will pick it up automatically via
# load_membership_snapshot.py.
#
# This workflow only rebuilds from whatever's already committed, so
# pushing freshly-fetched data is what triggers a real rebuild; pushing
# an unrelated doc change just reruns a no-op (byte-identical output
# means git has nothing to commit, so no extra push happens -- the
# pipeline is fully deterministic given the same input data, so this
# can't loop).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Bootstrap a test database
        run: |
          python3 src/bootstrap_league_db.py \
            --backup db/league_backup_before_playoff_migration.db \
            --out db/league.db
          for year in 2010 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            if [ -f "data/raw/games_${year}.csv" ]; then
              python3 src/load_games.py "data/raw/games_${year}.csv"
            fi
          done
          python3 src/patch_known_membership_gaps.py --db db/league.db
          for f in data/raw/membership_*.csv; do
            [ -e "$f" ] || continue
            year=$(basename "$f" .csv | sed 's/membership_//')
            python3 src/load_membership_snapshot.py "$f" --db db/league.db --year "$year"
          done
          python3 -c "
          import sqlite3
          conn = sqlite3.connect('db/league.db')
          conn.executescript(open('sql/standings_tables.sql').read())
          conn.executescript(open('sql/views/v_games_enriched.sql').read())
          conn.commit()
          "
          python3 src/build_coefficients.py
          for year in 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026; do
            python3 src/coefficients/compute_conference_team_records.py --year "$year" --no-validation
            python3 src/coefficients/derive_conference_standings_local.py --year "$year"
          done

      - name: Run tests
        run: pytest -v

  rebuild-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run full pipeline (bootstrap, load, ratings, standings)
        run: python3 run_pipeline.py --force

      - name: Rebuild the dashboard
        run: python3 build_dashboard.py --draw-seed 1

      - name: Commit and push if anything actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ui/dashboard.html ui/dashboard_data.json data/processed/
          git diff --staged --quiet || git commit -m "Auto-rebuild dashboard [skip ci]"
          git push
