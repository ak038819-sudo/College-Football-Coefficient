name: College basketball player-impact pilot

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Ending year (2026 means 2025-26)"
        type: choice
        options: ["2024", "2025", "2026"]
        default: "2026"
        required: true

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cbb-player-impact-pilot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install 'pytest>=7,<10'
      - name: Validate prototype
        run: python -m pytest tests/test_cbb_player_impact.py tests/test_cbb_integration_contract.py tests/test_cbb_reconciliation.py -q
      - name: TEMPORARY ingestion check (reverted before review)
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: |
          python -m pytest tests/test_ncaambb_ingestion.py tests/test_ncaambb_store.py -q
          python -m src.ncaambb.ingest --seasons 2026,2027
          python - <<'PY2'
          import sqlite3, subprocess, sys
          def counts():
              c = sqlite3.connect('db/ncaambb.db')
              try:
                  return {t: c.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0]
                          for t in ('team', 'team_season', 'game')}
              finally:
                  c.close()
          before = counts()
          run = subprocess.run([sys.executable, '-m', 'src.ncaambb.ingest',
                                '--seasons', '2026,2027'],
                               capture_output=True, text=True)
          print('second load rc', run.returncode)
          print(run.stdout[-1500:])
          after = counts()
          print('BEFORE', before, 'AFTER', after)
          assert before == after, 'NOT IDEMPOTENT'
          c = sqlite3.connect('db/ncaambb.db')
          c.row_factory = sqlite3.Row
          for q in [
            "SELECT season, COUNT(*) n, SUM(rateable) rateable, SUM(division_one) di, SUM(start_time_tbd) tbd FROM game GROUP BY season",
            "SELECT season, COUNT(*) n, SUM(division_one) di FROM team_season GROUP BY season",
            "SELECT COUNT(*) n FROM game WHERE status='final' AND (home_points IS NULL OR away_points IS NULL)",
            "SELECT exclusions, COUNT(*) n FROM game GROUP BY exclusions ORDER BY n DESC LIMIT 5",
          ]:
              print('--', q)
              for row in c.execute(q):
                  print('  ', dict(row))
          c.close()
          PY2
      - name: Collect three BYU games
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          PILOT_SEASON: ${{ inputs.season }}
        run: |
          python analysis/cbb_player_impact/collect.py \
            --season "$PILOT_SEASON" --team BYU --limit 3 \
            --out analysis/cbb_player_impact/snapshots/pilot
      - name: Summarize structural checks and minute reconciliation
        if: always()
        run: |
          python analysis/cbb_player_impact/summarize.py \
            --snapshot analysis/cbb_player_impact/snapshots/pilot \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve pilot snapshot and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbb-pilot-${{ inputs.season }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: analysis/cbb_player_impact/snapshots/pilot/
          if-no-files-found: warn
          retention-days: 30
