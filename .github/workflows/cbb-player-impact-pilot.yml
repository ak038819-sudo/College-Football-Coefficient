name: College basketball player-impact pilot

# TEMPORARY: this file is standing in for cbb-ingest.yml so the national
# ingestion can be validated against real data. workflow_dispatch only works
# for files already on the default branch, and cbb-ingest.yml is not there yet.
# Reverted in the next commit.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Ending year (2026 means 2025-26)"
        type: choice
        options: ["2024", "2025", "2026"]
        default: "2026"
        required: true

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: cbb-player-impact-pilot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install 'pytest>=7,<10'
      - name: Validate ingestion before spending quota
        run: |
          python -m pytest tests/test_ncaambb_ingestion.py \
            tests/test_ncaambb_store.py tests/test_ncaambb_people.py -q
      - name: Ingest the season with people
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          SEASONS: ${{ inputs.season }}
        run: |
          python -m src.ncaambb.ingest --seasons "$SEASONS"
      - name: Measure what landed
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect('db/ncaambb.db')
          q = lambda sql: c.execute(sql).fetchone()[0]
          print('== row counts ==')
          for table in ('team', 'team_season', 'game', 'player',
                        'player_team_season', 'team_game_stat',
                        'player_game_stat', 'snapshot'):
              print(f'{table}: {q(f"SELECT COUNT(*) FROM {table}")}')
          print('\n== identity ==')
          print('players whose key is not the namespaced provider id:',
                q("SELECT COUNT(*) FROM player WHERE player_key !="
                  " 'ncaambb:cbbd:player:' || provider_id"))
          print('players on two or more teams this season:',
                q("SELECT COUNT(*) FROM (SELECT player_key FROM"
                  " player_team_season GROUP BY player_key, season"
                  " HAVING COUNT(*) > 1)"))
          print('players with a stat line but no roster row:',
                q("SELECT COUNT(DISTINCT player_key) FROM player_game_stat"
                  " WHERE player_key NOT IN (SELECT player_key FROM"
                  " player_team_season)"))
          print('\n== blanks are blanks ==')
          print('team box scores with NULL points:',
                q('SELECT COUNT(*) FROM team_game_stat WHERE points IS NULL'))
          print('player lines with NULL minutes:',
                q('SELECT COUNT(*) FROM player_game_stat WHERE minutes IS NULL'))
          print('player lines with zero minutes recorded:',
                q('SELECT COUNT(*) FROM player_game_stat WHERE minutes = 0'))
          print('\n== box score vs final score ==')
          print('final games with no box score at all:',
                q("SELECT COUNT(*) FROM game WHERE status = 'final' AND"
                  " game_key NOT IN (SELECT game_key FROM team_game_stat)"))
          print('team box scores whose points differ from the final score:',
                q("SELECT COUNT(*) FROM team_game_stat s JOIN game g USING"
                  " (game_key) WHERE s.points IS NOT NULL AND"
                  " ((s.team_key = g.home_team_key AND s.points !="
                  " g.home_points) OR (s.team_key = g.away_team_key AND"
                  " s.points != g.away_points))"))
          print('\n== snapshots ==')
          for row in c.execute('SELECT snapshot_id, kind, season, requests,'
                               ' retries, rows_seen FROM snapshot'):
              print(dict(zip(('id', 'kind', 'season', 'requests', 'retries',
                              'rows_seen'), row)))
          c.close()
          PY
      - name: Prove a second load changes nothing
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          SEASONS: ${{ inputs.season }}
        run: |
          python - <<'PY'
          import os, sqlite3, subprocess, sys
          TABLES = ('team', 'team_season', 'game', 'player',
                    'player_team_season', 'team_game_stat', 'player_game_stat')
          def counts():
              c = sqlite3.connect('db/ncaambb.db')
              try:
                  return {t: c.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0]
                          for t in TABLES}
              finally:
                  c.close()
          before = counts()
          run = subprocess.run([sys.executable, '-m', 'src.ncaambb.ingest',
                                '--seasons', os.environ['SEASONS']],
                               capture_output=True, text=True)
          if run.returncode != 0:
              sys.exit(f'second load failed: {run.stderr[-3000:]}')
          print(run.stdout[-3000:])
          after = counts()
          print(f'before {before}\nafter  {after}')
          if before != after:
              sys.exit('a second load changed the row counts; not idempotent')
          print('Idempotent: a second load changed no row count.')
          PY
      - name: Raw cache size
        if: always()
        run: du -sh data/ncaambb/raw/* db/ncaambb.db 2>/dev/null || true
