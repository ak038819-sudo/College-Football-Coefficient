name: College basketball player impact pilot

# Ingests a range of seasons' schedules, fits the Elo parameters on all but the
# last, scores the last one, and replays the archive with what the fit chose.
#
# Box scores are not needed here and are not fetched: a rating reads the final
# score, which the schedule endpoint already carries. That keeps a fit run to
# about a dozen requests a season.
#
# This does NOT commit and does NOT publish. The B04 export gate does not exist
# yet, so the database and the fit report stay inside the run and leave as an
# artifact. Football refresh is untouched.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma-separated ending years, oldest first"
        type: string
        default: "2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026"
        required: true
      holdout:
        description: "Ending year to score; blank means the latest ingested"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: cbb-player-impact-pilot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install 'pytest>=7,<10'
      - name: Validate before spending quota
        run: |
          python -m pytest tests/test_ncaambb_elo.py tests/test_ncaambb_store.py \
            tests/test_ncaambb_ingestion.py -q
      - name: Ingest the schedules
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          SEASONS: ${{ inputs.seasons }}
        run: |
          # `cmd | tee` reports tee's status, so without pipefail a crash in
          # the ingestion passes this step. It did exactly that once.
          set -o pipefail
          python -m src.ncaambb.ingest --seasons "$SEASONS" --schedule-only \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fit the model and score the held-out season
        env:
          HOLDOUT: ${{ inputs.holdout }}
        run: |
          set -o pipefail
          args=""
          if [ -n "$HOLDOUT" ]; then args="--holdout $HOLDOUT"; fi
          python -m src.ncaambb.fit_elo $args \
            --out data/ncaambb/processed/elo_fit.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Write the chosen configuration and report any drift
        run: |
          set -o pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('data/ncaambb/processed/elo_fit.json')
                              .read_text(encoding='utf-8'))
          chosen = report['chosen']
          out = Path('config/ncaambb_model.json')
          # The committed configuration is what every later run replays with.
          # A fit that now prefers something else is not an error, but it must
          # not be silent: the run would otherwise replay with the new choice
          # and the repository would keep the old one.
          before = (json.loads(out.read_text(encoding='utf-8')).get('elo')
                    if out.exists() else None)
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({'elo': chosen}, indent=2, sort_keys=True)
                         + '\n', encoding='utf-8')
          print('## Configuration used by this replay\n')
          print('```json')
          print(out.read_text(encoding='utf-8').rstrip())
          print('```\n')
          if before is None:
              print('No configuration was committed; this run wrote the first.')
          elif before == chosen:
              print('Unchanged from the committed `config/ncaambb_model.json`.')
          else:
              keys = sorted(set(before) | set(chosen))
              print('DRIFT from the committed `config/ncaambb_model.json`.'
                    ' Commit this if it is the model you want:\n')
              print('| parameter | committed | this fit |')
              print('| --- | --- | --- |')
              for key in keys:
                  was, now = before.get(key), chosen.get(key)
                  if was != now:
                      print(f'| {key} | {was} | {now} |')
          PY
      - name: Replay the archive and store the ratings
        run: |
          set -o pipefail
          python -m src.ncaambb.build_ratings \
            --report data/ncaambb/processed/elo_fit.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prove a second replay changes nothing
        run: |
          python - <<'PY'
          import sqlite3, subprocess, sys
          TABLES = ('rating_model', 'team_rating', 'rating_game')
          def snapshot():
              c = sqlite3.connect('db/ncaambb.db')
              try:
                  counts = {t: c.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0]
                            for t in TABLES}
                  ratings = c.execute('SELECT team_key, season, rating FROM'
                                      ' team_rating ORDER BY team_key, season'
                                      ).fetchall()
                  return counts, ratings
              finally:
                  c.close()
          before = snapshot()
          run = subprocess.run([sys.executable, '-m', 'src.ncaambb.build_ratings',
                                '--report', 'data/ncaambb/processed/elo_fit.json'],
                               capture_output=True, text=True)
          if run.returncode != 0:
              sys.exit(f'second replay failed: {run.stderr[-3000:]}')
          after = snapshot()
          print(f'row counts before {before[0]} and after {after[0]}')
          if before[0] != after[0]:
              sys.exit('a second replay changed the row counts')
          if before[1] != after[1]:
              sys.exit('a second replay changed a rating; the replay is not '
                       'deterministic')
          print('Deterministic: a second replay produced identical ratings.')
          PY
      - name: Export the archive, which only happens if the gate allows it
        run: |
          set -o pipefail
          python -m src.ncaambb.export --out "$RUNNER_TEMP/ncaambb-export" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the publish gate again, standing alone, on what was written
        run: |
          # The export already refused to write a bad directory. This is the
          # check a publishing workflow would make on a directory it did not
          # build, which is a different check and must pass on its own.
          set -o pipefail
          python -m src.ncaambb.publish_gate "$RUNNER_TEMP/ncaambb-export" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Show what the export would publish
        run: |
          # The export goes to a temporary directory on purpose. Release gate 6
          # decides whether these files are ever served; nothing here commits
          # to ui/data/ncaambb or touches the football manifest.
          {
            echo '### Export contents'
            echo
            echo '```'
            du -sh "$RUNNER_TEMP/ncaambb-export"
            find "$RUNNER_TEMP/ncaambb-export" -type f -printf '%10s  %P\n' \
              | sort -k2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp -r "$RUNNER_TEMP/ncaambb-export" ncaambb-export
      - name: Preserve the fit, the config and the database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbb-ratings-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            db/ncaambb.db
            config/ncaambb_model.json
            data/ncaambb/processed/elo_fit.json
            ncaambb-export
          if-no-files-found: warn
          retention-days: 30
