name: Basketball player impact pilot

# TEMPORARILY borrowed. Restored byte-identically to 9dcd184 afterwards.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "usage-only, or a full measurement"
        type: choice
        options: ["usage-only", "full"]
        default: "usage-only"

permissions:
  contents: read

concurrency:
  group: cbb-limit-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Ask the provider what it allows
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          args=""
          if [ "$MODE" = "usage-only" ]; then args="--usage-only"; fi
          python scripts/probe_cbbd_limits.py $args \
            | tee -a "$GITHUB_STEP_SUMMARY"
