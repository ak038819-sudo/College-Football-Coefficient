name: Basketball player impact pilot

# TEMPORARILY borrowed to measure what the provider will actually allow, and
# restored byte-identically afterwards. workflow_dispatch only registers a
# workflow whose filename is already on the default branch, which is why a
# diagnostic has to borrow a slot rather than arrive in its own file.

on:
  workflow_dispatch:
    inputs:
      burst:
        description: "Unpaced requests to try before giving up"
        type: string
        default: "8"
      interval:
        description: "Seconds between requests in the paced run"
        type: string
        default: "2.0"
      paced:
        description: "How many paced requests to try"
        type: string
        default: "6"
      cooldown:
        description: "Seconds between the two measurements"
        type: string
        default: "90"

permissions:
  contents: read

concurrency:
  group: cbb-limit-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Ask the provider what it allows
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          BURST: ${{ inputs.burst }}
          INTERVAL: ${{ inputs.interval }}
          PACED: ${{ inputs.paced }}
          COOLDOWN: ${{ inputs.cooldown }}
        run: |
          set -o pipefail
          python scripts/probe_cbbd_limits.py \
            --burst "$BURST" --interval "$INTERVAL" \
            --paced "$PACED" --cooldown "$COOLDOWN" \
            | tee -a "$GITHUB_STEP_SUMMARY"
