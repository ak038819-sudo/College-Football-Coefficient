name: College basketball player-impact pilot

# TEMPORARY: standing in for a box-score limit probe, which is not dispatchable
# until it reaches the default branch. Reverted in the next commit.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Ending year (2026 means 2025-26)"
        type: choice
        options: ["2024", "2025", "2026"]
        default: "2026"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cbb-box-cap-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install 'pytest>=7,<10'
      - name: Validate the probe
        run: python -m pytest tests/test_ncaambb_box_cap.py -q
      - name: The busiest window, whole and day by day
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: |
          set -o pipefail
          python -m src.ncaambb.probe_box_cap --season 2026 \
            --first 2025-11-13 --last 2025-11-27 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The same test on /games, whose cap is on records
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: |
          set -o pipefail
          python -m src.ncaambb.probe_box_cap --season 2026 --path /games \
            --first 2025-11-13 --last 2025-11-27 | tee -a "$GITHUB_STEP_SUMMARY"
