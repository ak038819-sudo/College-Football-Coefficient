name: College basketball coverage probe

# Measures what the provider holds per season. Fetches and reports; it writes
# no data file, no database and no commit, so it cannot publish anything.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma-separated ending years (2026 means 2025-26)"
        type: string
        default: "2024,2025,2026,2027"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cbb-coverage-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install 'pytest>=7,<10'
      - name: Validate ingestion before spending quota
        run: python -m pytest tests/test_ncaambb_ingestion.py -q
      - name: Report what the account has spent
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: |
          # TEMPORARY, reverted in the next commit on this branch: this slot is
          # borrowed to ask the usage endpoint how much of the rolling window
          # has aged out, because a workflow_dispatch can only reach a workflow
          # already on the default branch. Three requests, no data written.
          set -o pipefail
          python scripts/probe_cbbd_limits.py --usage-only \
            | tee -a "$GITHUB_STEP_SUMMARY"
