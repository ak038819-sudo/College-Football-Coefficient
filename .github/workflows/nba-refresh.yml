name: Refresh NBA ratings

# Rebuilds the NBA ratings from the committed model and replaces the published
# export, and does neither if what it built would not pass the publish gate.
#
# The same three rules the NFL and basketball refreshes follow:
#
# 1. An NBA failure must not stop any other league's refresh. This is a
#    separate workflow with its own concurrency group and its own health
#    light; it never runs, waits on, or cancels anything of football's.
# 2. A failure must not replace valid data with empty files. The export is
#    built in a temporary directory and swapped in only once the gate passes,
#    so an outage leaves yesterday's ratings exactly where they are and the
#    page marks them stale on its own.
# 3. The model is NOT refitted here. src/nba/fit_elo.py chooses the parameters
#    and a person commits them; a refresh that quietly refits would change the
#    ratings' meaning on a schedule nobody is watching.
#
# Like the NFL's and unlike basketball's, the raw archive is NOT committed:
# the source is a set of public release assets with no key and no cap, so
# refetching is free and there is no request allowance to husband. It
# therefore has no secret and no quota step. A fetch failure is a network
# failure, and the retry curve in src/nba/source.py covers it.
#
# PYARROW IS A REQUIREMENT, NOT A CONVENIENCE. The source publishes Parquet,
# so without it the ingest cannot read one byte. It is installed here
# explicitly rather than left to requirements-dev.txt, so that a change to
# that file cannot silently take the NBA refresh offline.
#
# The commit carries `[skip ci]`, which is safe here: ui/nba.html fetches the
# committed export directly, so GitHub Pages republishing the files is all it
# takes. Nothing needs the football deploy to regenerate a dashboard.

on:
  schedule:
    # Early morning US time through the NBA season, which runs October to
    # June. Out of season this publishes the same export and commits nothing.
    - cron: "20 11 * 10,11,12,1,2,3,4,5,6 *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Commit the export to main when the gate passes"
        type: boolean
        default: true
      seasons:
        description: "Only ingest these seasons (e.g. 2026,2027). Leave empty
          for every season; a partial run builds a partial archive and may
          not publish."
        type: string
        default: ""
      pbp_seasons:
        description: "Only reduce the play-by-play for these seasons. For
          rehearsing a reduction; a partial one may not publish."
        type: string
        default: ""
      people_seasons:
        description: "Only load the people layer for these seasons. For
          rehearsing it; a partial one publishes a partial archive of
          careers."
        type: string
        default: ""
      team_box_seasons:
        description: "Only load the team box scores for these seasons. For
          rehearsing the load; a partial one leaves the other seasons with
          no team statistics and may not publish."
        type: string
        default: ""
      net_points_seasons:
        description: "Only import ESPN's net points for these seasons. For
          rehearsing the import; a partial one leaves the other seasons
          with no player ratings and may not publish."
        type: string
        default: ""

permissions:
  contents: write
  # The health light below. Scoped to this workflow, so it can never close
  # another league's alert.
  issues: write

concurrency:
  # Deliberately NOT the deploy's group. A refresh that shared it would sit
  # behind a deploy and then be cancelled by the next one.
  group: nba-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The reduction fetches and discards 0.44 GB, which is most of this.
    timeout-minutes: 90
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the reader and the test runner
        run: python -m pip install 'pytest>=7,<10' 'pyarrow>=14.0'

      - name: Validate before touching anything published
        run: |
          python -m pytest tests/test_nba_data.py tests/test_nba_rating.py \
            tests/test_nba_export.py tests/test_nba_plays.py \
            tests/test_nba_game_export.py \
            tests/test_nba_people.py \
            tests/test_nba_team_stats.py \
            tests/test_nba_series.py \
            tests/test_nba_win_probability.py -q

      - name: Ingest the archive
        run: |
          # `cmd | tee` reports tee's status, so without pipefail a crash here
          # would pass this step. It has done exactly that in this repository.
          set -o pipefail
          python -m src.nba.ingest \
            ${{ inputs.seasons && format('--seasons {0}', inputs.seasons) || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Reduce the play-by-play to the game layer
        run: |
          # 0.44 GB of Parquet across 26 seasons, fetched one season at a
          # time, reduced, and DELETED before the next one is fetched. Not
          # one play is stored or committed: what comes out is 127,000
          # periods, 1.68 million curve points and 156,000 key plays, which
          # is what a game page draws.
          #
          # The whole archive is re-reduced on every run rather than only
          # the season in progress, because nothing here is stateful: the
          # database is built from scratch each time, exactly as the games
          # are refetched each time. The alternative is committing derived
          # data and keeping it in step with the source, which is the
          # failure this pipeline is shaped to avoid.
          #
          # BEFORE the replay, because `fit_win_probability` is not run here
          # but `export` reads `game_shape` to decide whether there is a
          # game layer at all, and an export built without one would drop a
          # `files` key the published manifest has -- which src/nba/publish.py
          # refuses. A failure here fails the run, which says the same thing
          # earlier and more clearly.
          set -o pipefail
          python -m src.nba.plays --work-dir "$RUNNER_TEMP/nba-pbp" \
            ${{ inputs.pbp_seasons && format('--seasons {0}', inputs.pbp_seasons) || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Load the players and their box-score lines
        run: |
          # 2,635 players, 850,950 box-score lines (670,667 of them with
          # minutes) and the 20,132 season rollups derived from them.
          # Fetched one season at a time and discarded like the
          # play-by-play: nothing raw is stored or committed.
          #
          # AFTER the schedule, because a box-score line for a game the
          # schedule does not carry is dropped rather than invented, and
          # BEFORE the export, which decides from `person_game` whether
          # there is a people layer to write at all. An export built
          # without one would drop a `files` key the published manifest
          # has, which src/nba/publish.py refuses -- so a failure here
          # fails the run, which says the same thing earlier.
          set -o pipefail
          python -m src.nba.people \
            ${{ inputs.people_seasons && format('--seasons {0}', inputs.people_seasons) || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Load the team box scores
        run: |
          # 64,672 rows across 26 seasons, two a game, fetched one season at
          # a time and discarded like the play-by-play. What comes out are
          # the COUNTS that PxP+ and the opportunity grades are computed
          # from; not one rate is stored.
          #
          # AFTER the schedule, because a box score for a game the schedule
          # does not carry is dropped rather than invented, and because the
          # season type a row is stored under is the SCHEDULE's -- this feed
          # calls the NBA Cup final a regular-season game. BEFORE the
          # export, which decides from `team_game_box` whether there are
          # team statistics to publish at all; an export built without them
          # would blank columns the published one carries, and
          # src/nba/publish.py refuses that. A failure here fails the run,
          # which says the same thing earlier and more clearly.
          set -o pipefail
          python -m src.nba.team_box \
            ${{ inputs.team_box_seasons && format('--seasons {0}', inputs.team_box_seasons) || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Import ESPN's net points
        run: |
          # The per-player, per-game offensive and defensive net points the
          # player rating is replayed from, taken from the public archive at
          # basketball-data.billmill.org. Nothing here rates anybody: what is
          # stored is one grade an appearance and the two possession counts
          # it is a rate over.
          #
          # AFTER the schedule and the people, because every grade is
          # resolved to a game of ours and a person of ours before it is
          # stored, and one that resolves to neither is quarantined in
          # `player_net_points_unresolved` rather than invented. BEFORE the
          # replay below, which reads the table this writes.
          set -o pipefail
          python -m src.nba.net_points \
            ${{ inputs.net_points_seasons && format('--seasons {0}',
                inputs.net_points_seasons) || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Replay the player rating
        run: |
          # The whole archive of grades walked in order into one rating a
          # player. AFTER the import above and after the people, whose
          # minutes decide which men a board may rank; BEFORE the export,
          # which reads `player_rating` and refuses an export that would
          # drop a layer the published one carries.
          set -o pipefail
          python -m src.nba.player_elo | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Replay the archive with the committed model
        run: |
          set -o pipefail
          python -m src.nba.build_ratings | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the export, which refuses rather than writes
        run: |
          set -o pipefail
          python -m src.nba.export --out "$RUNNER_TEMP/nba-export" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Decide whether it may replace what is published
        id: publish
        env:
          BUILT: ${{ runner.temp }}/nba-export
          # A PARTIAL INGEST MAY NEVER PUBLISH. `seasons` ingests only the
          # seasons named, and the database is built from scratch on every
          # run, so a two-season run would build a two-season export. The
          # gate checks the seasons that ARE there and would pass it. The
          # input is for rehearsing an ingest, and this is what keeps it to
          # that. `pbp_seasons` is the same hazard one layer down: a
          # one-season reduction would build a game layer covering one
          # season, and nothing downstream would notice it replacing
          # twenty-six. `team_box_seasons` is the same hazard again: the
          # team statistics have no `files` key of their own, so a one-season
          # load would publish the same file list with every other season's
          # PxP+ gone. `net_points_seasons` is that hazard once more: the
          # replay walks the grades that are in the table, so importing one
          # season would publish a board drawn on one season of evidence.
          ALLOWED: ${{ (inputs.publish == null && 'true' || inputs.publish)
            && (inputs.seasons == null || inputs.seasons == '')
            && (inputs.pbp_seasons == null || inputs.pbp_seasons == '')
            && (inputs.team_box_seasons == null
                || inputs.team_box_seasons == '')
            && (inputs.net_points_seasons == null
                || inputs.net_points_seasons == '') }}
        run: |
          set -o pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys
          sys.path.insert(0, '.')
          from src.nba import publish
          built, live = os.environ['BUILT'], 'ui/data/nba'
          decision = publish.plan(built, live)
          print(publish.render(decision))
          allowed = os.environ.get('ALLOWED', 'true') == 'true'
          if decision['publish'] and allowed:
              publish.apply(decision, built, live)
          elif decision['publish']:
              print('\nNot committed: this run was dispatched with '
                    'publishing off, or with only some seasons ingested '
                    'or reduced, which may not replace the whole archive.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"published={'true' if decision['publish'] and allowed else 'false'}\n")
          # A refusal is a failed run, not a quiet one: the health light below
          # is the only thing that would otherwise notice.
          sys.exit(0 if decision['publish'] else 1)
          PY

      - name: Commit the export
        if: steps.publish.outputs.published == 'true'
        run: |
          # This path only. A refresh must never carry a code change along
          # with it, whatever happens to be in the tree.
          PATHS="ui/data/nba"
          if [ -z "$(git status --porcelain $PATHS)" ]; then
            echo "Nothing changed under $PATHS; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          git commit -m "Refresh the NBA export

          Built by ${{ github.workflow }} run ${{ github.run_id }} from the
          committed model in config/nba_model.json. [skip ci]"
          # Push back to the branch this ran on. On main that is the published
          # site; on a branch it is that branch, which is how a release can be
          # rehearsed without a scheduled job writing to main first.
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if ! git fetch origin "$BRANCH"; then
              echo "::warning::fetch failed (attempt $attempt)"
              sleep $((attempt * attempt * 2)); continue
            fi
            # Rebase, then push. NEVER chain a push behind a merge with &&:
            # the push still runs when the merge fails and sends a conflicted
            # tree.
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::Could not rebase onto $BRANCH; leaving the published export alone."
              exit 1
            fi
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed."
              exit 0
            fi
            echo "::warning::push failed (attempt $attempt)"
            sleep $((attempt * attempt * 2))
          done
          echo "::error::Could not push the refreshed export."
          exit 1

  alert-failure:
    needs: refresh
    if: always() && needs.refresh.result == 'failure' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Light the NBA health light
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/alert_pipeline_state.py --state failed \
            --scope nba-refresh \
            --workflow "${{ github.workflow }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --consequence "NBA ratings stop refreshing while this is red. The other leagues are unaffected: each has its own workflow and its own alert. The published NBA export stays as it is and the page marks it stale."

  alert-recovery:
    needs: refresh
    if: always() && needs.refresh.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Put the NBA health light out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/alert_pipeline_state.py --state recovered \
            --scope nba-refresh \
            --workflow "${{ github.workflow }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
