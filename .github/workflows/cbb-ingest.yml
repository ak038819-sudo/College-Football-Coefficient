name: College basketball national ingestion

# Fetches a season's schedule, rosters and box scores, caches the raw
# responses, loads the basketball database and prints a coverage report.
#
# This does NOT commit and does NOT publish. The production export gate (B04)
# does not exist yet, so the database and the raw cache stay inside the run and
# leave as an artifact. Football refresh is untouched and cannot be affected by
# a failure here.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma-separated ending years (2026 means 2025-26)"
        type: string
        default: "2027"
        required: true
      refetch:
        description: "Ignore the raw cache and request everything again"
        type: boolean
        default: false
      people:
        description: "Also fetch rosters and box scores"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: cbb-ingest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install 'pytest>=7,<10'
      - name: Validate ingestion before spending quota
        run: |
          python -m pytest tests/test_ncaambb_ingestion.py \
            tests/test_ncaambb_store.py tests/test_ncaambb_people.py \
            tests/test_ncaambb_audit.py tests/test_ncaambb_box_cap.py -q
      - name: Ingest seasons
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          SEASONS: ${{ inputs.seasons }}
          REFETCH: ${{ inputs.refetch }}
          PEOPLE: ${{ inputs.people }}
        run: |
          # `cmd | tee` reports tee's status, so without pipefail a crash in
          # the ingestion passes this step. It did exactly that once.
          set -o pipefail
          args=""
          if [ "$REFETCH" = "true" ]; then args="$args --refetch"; fi
          if [ "$PEOPLE" != "true" ]; then args="$args --schedule-only"; fi
          python -m src.ncaambb.ingest --seasons "$SEASONS" $args \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Audit people coverage
        run: |
          set -o pipefail
          python -m src.ncaambb.audit_people | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prove a second load changes nothing
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          SEASONS: ${{ inputs.seasons }}
          PEOPLE: ${{ inputs.people }}
        run: |
          python - <<'PY'
          import os, sqlite3, subprocess, sys
          def counts():
              c = sqlite3.connect('db/ncaambb.db')
              try:
                  tables = ['team', 'team_season', 'game']
                  if os.environ.get('PEOPLE') == 'true':
                      tables += ['player', 'player_team_season',
                                 'team_game_stat', 'player_game_stat']
                  return {t: c.execute(f'SELECT COUNT(*) FROM {t}').fetchone()[0]
                          for t in tables}
              finally:
                  c.close()
          before = counts()
          # Reuses the raw cache, so this costs no provider requests.
          args = [] if os.environ.get('PEOPLE') == 'true' else ['--schedule-only']
          run = subprocess.run([sys.executable, '-m', 'src.ncaambb.ingest',
                                '--seasons', os.environ['SEASONS'], *args],
                               capture_output=True, text=True)
          if run.returncode != 0:
              sys.exit(f'second load failed: {run.stderr[-2000:]}')
          after = counts()
          print(f'row counts before {before} and after {after}')
          if before != after:
              sys.exit('a second load changed the row counts; loading is not idempotent')
          print('Idempotent: a second load of the same season changed no row count.')
          PY
      - name: Preserve the coverage report and database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbb-ingest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            db/ncaambb.db
            data/ncaambb/raw/
          if-no-files-found: warn
          retention-days: 30
