name: Refresh college basketball ratings

# Release gate 6's refresh. Rebuilds the basketball ratings from the committed
# model and replaces the published export, and does neither if what it built
# would not pass the publish gate.
#
# Three rules shape this file, all from the plan:
#
# 1. A basketball provider failure must not stop the football refresh. This is
#    a separate workflow with its own concurrency group and its own health
#    light; it never runs, waits on, or cancels anything of football's.
# 2. A failure must not replace valid data with empty files. The export is
#    built in a temporary directory and only swapped in once the gate passes,
#    so a provider outage leaves yesterday's ratings exactly where they are,
#    and the page marks them stale on its own.
# 3. The model is NOT refitted here. src/ncaambb/fit_elo.py chooses the
#    parameters and a person commits them; a refresh that quietly refits would
#    change the ratings' meaning on a schedule nobody is watching.
#
# It also commits `data/ncaambb/raw`, the gzipped provider responses. A settled
# season cannot change, so refetching twelve of them every morning spends quota
# on identical bytes -- and the first rehearsal of this workflow did exactly
# that and was cut off by HTTP 429 five seasons from the end. With the cache in
# the repository a run reloads the archive from disk and asks the provider only
# about the season being played.
#
# The commit carries `[skip ci]`, and unlike football's backfill that is not a
# trap here: ui/basketball.html fetches the committed export directly, so
# GitHub Pages republishing the files is all it takes. Nothing needs the
# football deploy to regenerate a dashboard.

on:
  schedule:
    # Early morning US time, through the basketball season. Out of season this
    # workflow simply publishes the same export and commits nothing.
    - cron: "40 10 * 11,12,1,2,3,4 *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Comma-separated ending years; blank means 2015 to the current season"
        type: string
        default: ""
      publish:
        description: "Commit the export to main when the gate passes"
        type: boolean
        default: true
      refetch_people:
        description: "Ending years whose ROSTERS and BOX SCORES to fetch again, e.g. 2026. Must be seasons this run gets people for. Blank means reuse every cached season."
        type: string
        default: ""

permissions:
  contents: write
  # The health light below. Scoped to this workflow, so it can never close
  # football's alert.
  issues: write

concurrency:
  # Deliberately NOT the deploy's group. A refresh that shared it would sit
  # behind a deploy and then be cancelled by the next one, which is exactly
  # what happened to live-scores.yml before it got its own group.
  group: cbb-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the test runner
        run: python -m pip install 'pytest>=7,<10'

      - name: Validate before spending provider quota
        run: |
          python -m pytest tests/test_ncaambb_elo.py \
            tests/test_ncaambb_store.py tests/test_ncaambb_ingestion.py \
            tests/test_ncaambb_export.py tests/test_ncaambb_export_people.py \
            tests/test_ncaambb_publish.py -q

      - name: Work out which seasons to refresh
        id: seasons
        env:
          REQUESTED: ${{ inputs.seasons }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timezone
          from src.ncaambb.identity import current_season, seasons_through
          requested = (os.environ.get('REQUESTED') or '').strip()
          # The ending year comes from the shared helper, never from a copy
          # of the rule written into a workflow where no test can reach it.
          now = datetime.now(timezone.utc)
          seasons = requested or ','.join(
              str(year) for year in seasons_through(now))
          print(f'list={seasons}')
          # The season being played is the one whose games change. It is named
          # separately so the ingestion can ask again about it while reusing
          # the committed cache for every settled season -- and only if this
          # run is actually fetching it, since a hand-dispatched run may ask
          # for an older season alone.
          active = current_season(now)
          asked = {int(part) for part in seasons.split(',') if part.strip()}
          print(f'active={active if active in asked else ""}')
          # Which seasons get PEOPLE. Fewer than get ratings, and the number
          # comes from the exporter rather than from a copy of it written
          # here: a season is around 127,500 player-game lines, the export
          # publishes the most recent DEFAULT_SEASONS of them, and fetching
          # people for seasons the export will not carry would spend quota on
          # data no page can read.
          from src.ncaambb.export_people import recent
          print('people=' + ','.join(str(year) for year in recent(asked)))
          PY

      - name: Ingest the schedules
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          SEASONS: ${{ steps.seasons.outputs.list }}
          ACTIVE: ${{ steps.seasons.outputs.active }}
        run: |
          # `cmd | tee` reports tee's status, so without pipefail a crash here
          # would pass this step. It did exactly that once.
          set -o pipefail
          # No blanket --refetch: a settled season already in the committed raw
          # cache costs no request, and that is what keeps this run under the
          # provider's limit. The season being played is the exception, and it
          # has to be: a cached season is never asked about again, so without
          # --refetch-seasons the first run to cache it would freeze it, and
          # every later export would carry a fresh generated_at over games
          # that had stopped moving.
          python -m src.ncaambb.ingest --seasons "$SEASONS" --schedule-only \
            ${ACTIVE:+--refetch-seasons "$ACTIVE"} \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Rosters, player identities and box scores, for the seasons the export
      # publishes player files for. A SECOND invocation rather than dropping
      # --schedule-only above, because the two cover different seasons: every
      # rated season gets a schedule, and only the recent ones get people.
      #
      # No --refetch-seasons here, deliberately. The step above has just
      # refreshed the active season's schedule into the cache, so this run
      # reads it from disk; and the active season's PEOPLE cache is never
      # committed (see the commit step), so a fresh checkout has none and
      # fetches it. Settled seasons are in the repository and cost nothing.
      # BEST EFFORT, and it has to be. Before this step existed a provider
      # failure could not stop the refresh; with it, a 429 on one season's box
      # scores skipped the replay, the export and the publish, so the
      # scoreboard and the ratings stopped refreshing because a roster feed
      # was busy. MEASURED on run 41675786786, which was rate limited on
      # 2026-27's /games/players nineteen minutes after a 446-request run and
      # published nothing at all as a result.
      #
      # So the step may fail without failing the run. What it cannot do is
      # fail silently: the warning below says so, the export states which
      # seasons it carries people for, and the page says the same to a reader.
      # Staleness is marked, never refused -- the same rule the publish gate
      # follows.
      - name: Ingest the people
        id: people
        continue-on-error: true
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          PEOPLE: ${{ steps.seasons.outputs.people }}
          # Blank on a schedule, and blank on a dispatch unless someone asks.
          # A cached season is never asked about again, which is what keeps a
          # daily run cheap, so repairing one that was cached from a partly
          # refused run needs this said out loud. MEASURED: 2025-26 was banked
          # by such a run and holds 5,643 roster memberships against 15,210
          # for the season before it -- the box-score lines are complete, so
          # the players and their minutes are all there and what is missing is
          # jerseys and positions.
          #
          # It also refetches those seasons' SCHEDULES, because the flag
          # ignores a season's whole cache. That is about 26 more calls per
          # season and the schedules are reloaded correctly, so it is a cost
          # rather than a problem.
          REFETCH_PEOPLE: ${{ inputs.refetch_people }}
        run: |
          set -o pipefail
          if [ -z "$PEOPLE" ]; then
            echo "No season in this run gets people files."
            exit 0
          fi
          args=""
          if [ -n "$REFETCH_PEOPLE" ]; then
            args="--refetch-seasons $REFETCH_PEOPLE"
            echo "Fetching people again for: $REFETCH_PEOPLE"
          fi
          python -m src.ncaambb.ingest --seasons "$PEOPLE" $args \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Say so when the people did not all arrive
        if: steps.people.outcome != 'success'
        run: |
          echo "::warning::The people ingestion did not finish. The export is"\
            " built and published from whatever people the database holds, so"\
            " a season may carry no player files; the export states which"\
            " seasons it carries and the page tells a reader the same. The"\
            " seasons already fetched are cached, so the next run resumes."
          {
            echo
            echo '> **The people ingestion did not finish.** The export below'
            echo '> is built from whatever people the database holds. The'
            echo '> seasons it did fetch are cached, so the next run resumes.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Marks for schools this site has not banked one for yet, which is
      # every school on the first run and a new or rebranded one after
      # that. A file already on disk is left alone, so this asks the CDN
      # for nothing on an ordinary night. BEST EFFORT, like the people:
      # the page draws a blank box where a mark is missing, and a logo
      # CDN having a bad minute must never stop the ratings refreshing.
      - name: Bank any club mark not already here
        id: marks
        continue-on-error: true
        run: |
          set -o pipefail
          python -m src.ncaambb.fetch_logos | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Say so when a mark did not arrive
        if: steps.marks.outcome != 'success'
        run: |
          echo "::warning::Some club marks could not be fetched. The page"\
            " draws a blank box where one is missing and the next run tries"\
            " again; nothing else is affected."

      - name: Replay the archive with the committed model
        run: |
          set -o pipefail
          python -m src.ncaambb.build_ratings | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the export, which refuses rather than writes
        run: |
          set -o pipefail
          python -m src.ncaambb.export --out "$RUNNER_TEMP/ncaambb-export" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Decide whether it may replace what is published
        id: publish
        env:
          BUILT: ${{ runner.temp }}/ncaambb-export
          # NOT `inputs.publish == null && 'true' || inputs.publish`,
          # which this was and which never worked: GitHub's `==`
          # coerces both sides to a number, so `false == null` is 0 == 0,
          # which is TRUE -- an explicit `publish: false` was
          # indistinguishable from giving no input at all and published
          # anyway. Measured on run 41671313813, dispatched with
          # publish: false, which replaced the export regardless.
          # The event name is the thing actually being asked about: only
          # a dispatch carries inputs, and on a dispatch the declared
          # default means inputs.publish is always a real boolean.
          ALLOWED: ${{ github.event_name != 'workflow_dispatch'
            || inputs.publish }}
        run: |
          set -o pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from src.ncaambb import publish
          built, live = os.environ['BUILT'], 'ui/data/ncaambb'
          decision = publish.plan(built, live)
          print(publish.render(decision))
          allowed = os.environ.get('ALLOWED', 'true') == 'true'
          if decision['publish'] and allowed:
              publish.apply(decision, built, live)
          elif decision['publish']:
              print('\nNot committed: this run was dispatched with publishing off.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"published={'true' if decision['publish'] and allowed else 'false'}\n")
          # A refusal is a failed run, not a quiet one: the health light below
          # is the only thing that would otherwise notice.
          sys.exit(0 if decision['publish'] else 1)
          PY

      # Runs even when the ingestion or the gate failed, which is the point.
      # The raw cache is the provider data this run paid quota for; a season
      # it managed to fetch before the rate limit must be banked, or the next
      # run spends the same quota on the same seasons and gets no further. A
      # rate-limited run therefore still makes progress, and the job still
      # fails, so the health light below still lights.
      - name: Commit the raw cache and, if the gate allowed it, the export
        if: always() && steps.seasons.conclusion == 'success'
        env:
          # NOT `inputs.publish == null && 'true' || inputs.publish`,
          # which this was and which never worked: GitHub's `==`
          # coerces both sides to a number, so `false == null` is 0 == 0,
          # which is TRUE -- an explicit `publish: false` was
          # indistinguishable from giving no input at all and published
          # anyway. Measured on run 41671313813, dispatched with
          # publish: false, which replaced the export regardless.
          # The event name is the thing actually being asked about: only
          # a dispatch carries inputs, and on a dispatch the declared
          # default means inputs.publish is always a real boolean.
          ALLOWED: ${{ github.event_name != 'workflow_dispatch'
            || inputs.publish }}
          ACTIVE: ${{ steps.seasons.outputs.active }}
        run: |
          # The raw cache is banked whatever else happened, and the `publish`
          # input does NOT govern it. "Do not replace what is published" and
          # "throw away the quota this run already spent" are different
          # decisions, and a dispatcher asking for the first does not want the
          # second. It also makes `publish: false` the safe way to warm the
          # cache for a season without touching the live export.
          # The marks go with it: they are fetched above and a mark that
          # arrived and was not committed would be refetched every run.
          PATHS="data/ncaambb/raw ui/assets/ncaambb"
          # The export only when the gate passed -- a refused export is not in
          # the tree at all -- and only when this run is allowed to publish.
          if [ "${{ steps.publish.outputs.published }}" = "true" ] \
              && [ "$ALLOWED" = "true" ]; then
            PATHS="$PATHS ui/data/ncaambb"
          else
            echo "Committing the raw cache only; the export is not being published."
          fi
          if [ -z "$(git status --porcelain $PATHS)" ]; then
            echo "Nothing changed under $PATHS; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          # The ACTIVE season's people cache is NOT banked. Its box scores
          # change every night, so committing them writes a multi-megabyte
          # blob into the repository every single day, for a file the next
          # run would have to refetch anyway. Settled seasons are the
          # opposite: they cannot change, so banking them once is what keeps
          # this run inside the provider's allowance. The season's SCHEDULE
          # cache is still committed -- it is one file and the export reads
          # every season from it.
          if [ -n "$ACTIVE" ]; then
            git reset -q -- "data/ncaambb/raw/$ACTIVE/rosters.json.gz" \
              "data/ncaambb/raw/$ACTIVE/box_scores.json.gz" || true
          fi
          # Only these paths. A refresh must never carry a code change along
          # with it, whatever happens to be in the tree.
          git commit -m "Refresh the college basketball export

          Built by ${{ github.workflow }} run ${{ github.run_id }} from the
          committed model in config/ncaambb_model.json. Carries the raw
          provider cache this run fetched, so a later run reloads those
          seasons from the repository instead of spending quota on data that
          cannot change. [skip ci]"
          # Push back to the branch this ran on. On main that is the
          # published site; on a branch it is that branch, which is how a
          # release can be prepared without a scheduled job writing to main
          # before anybody has looked at it.
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if ! git fetch origin "$BRANCH"; then
              echo "::warning::fetch failed (attempt $attempt)"
              sleep $((attempt * attempt * 2)); continue
            fi
            # Rebase, then push. NEVER chain a push behind a merge with &&:
            # the push still runs when the merge fails and sends a conflicted
            # tree.
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::Could not rebase onto $BRANCH; leaving the published export alone."
              exit 1
            fi
            if git push origin "HEAD:$BRANCH"; then
              echo "Pushed."
              exit 0
            fi
            echo "::warning::push failed (attempt $attempt)"
            sleep $((attempt * attempt * 2))
          done
          echo "::error::Could not push the refreshed export."
          exit 1

  alert-failure:
    needs: refresh
    # Only for the branch the site publishes from. A dispatch on a feature
    # branch is a rehearsal, and lighting the production health light for one
    # leaves a red light over a working pipeline -- which then has to be
    # closed by hand, because a green run closes only one issue.
    if: always() && needs.refresh.result == 'failure'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Light the basketball health light
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/alert_pipeline_state.py --state failed \
            --scope cbb-refresh \
            --workflow "${{ github.workflow }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --consequence "Basketball ratings stop refreshing while this is red. Football is unaffected: it has its own workflow and its own alert. The published basketball export stays as it is and the page marks it stale."

  alert-recovery:
    needs: refresh
    if: always() && needs.refresh.result == 'success'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Put the basketball health light out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/alert_pipeline_state.py --state recovered \
            --scope cbb-refresh \
            --workflow "${{ github.workflow }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
