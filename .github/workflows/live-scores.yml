name: Refresh live scores

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-scores.yml'
      - 'src/fetch_live_scores.py'
  schedule:
    # Regular season: Thursday afternoon/night, Friday night, Saturday.
    # UTC windows include the preceding Central evening after midnight UTC.
    - cron: '2/5 19-23 * 8-11 4'
    - cron: '2/5 0-7,20-23 * 8-11 5'
    - cron: '2/5 0-7,14-23 * 8-11 6'
    - cron: '2/5 0-9 * 8-11 0'
    # Bowl/playoff season has games on any weekday. 15-minute polling keeps
    # December/January coverage within the existing API call budget.
    - cron: '7/15 15-23 * 12,1 *'
    - cron: '7/15 0-7 * 12,1 *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: rebuild-and-deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fetch subscriber scoreboard
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo 'Live scores inactive: set the CFBD_API_KEY secret with scoreboard access.'
            exit 0
          fi
          python3 src/fetch_live_scores.py
      - name: Check feed freshness
        if: always()
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          path = Path('ui/data/live_scores.json')
          if not path.exists():
              raise SystemExit('No scoreboard snapshot was published')
          data = json.loads(path.read_text())
          stamp = dt.datetime.fromisoformat(data['updated_at'].replace('Z', '+00:00'))
          age = dt.datetime.now(dt.timezone.utc) - stamp
          if age > dt.timedelta(minutes=20):
              raise SystemExit(f'Scoreboard snapshot is stale by {age}')
          print(f"Scoreboard fresh; {len(data.get('player_boxscores', {}))} games with player lines")
          PY
      - name: Publish changed snapshot
        run: |
          if git diff --quiet -- ui/data/live_scores.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # This runs every hour during the season, so it races the deploy more
          # often than anything else here. The script merges a main that moved
          # instead of rebasing onto it, and reports a failure instead of
          # leaving a conflicted tree behind an unchecked push.
          scripts/publish_to_main.sh 'Refresh live scoreboard [skip ci]' ui/data/live_scores.json
      - name: Measure delivery to GitHub Pages
        if: success()
        continue-on-error: true
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ui/data/live_scores.json
        run: python3 src/measure_live_delivery.py --url "$PAGES_URL" --timeout 120
