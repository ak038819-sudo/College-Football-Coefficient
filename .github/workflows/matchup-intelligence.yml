name: Matchup Intelligence (experimental)

on:
  pull_request:
    paths:
      - 'src/matchup_intelligence.py'
      - 'src/build_matchup_intelligence.py'
      - 'src/validate_matchup_intelligence.py'
      - 'src/audit_matchup_coverage.py'
      - 'src/export_matchup_scouting.py'
      - 'src/stage_matchup_backfill.py'
      - 'src/check_matchup_data_readiness.py'
      - 'src/calibrate_matchup_splits.py'
      - 'src/describe_matchup_metrics.py'
      - 'src/audit_matchup_stability.py'
      - 'src/audit_matchup_descriptive_research.py'
      - 'src/analyze_matchup_percentile_stability.py'
      - 'src/fetch_cfbd_game_advanced.py'
      - 'src/load_game_advanced.py'
      - 'sql/game_advanced_tables.sql'
      - 'tests/test_matchup_intelligence.py'
      - 'tests/test_build_matchup_intelligence.py'
      - 'tests/test_matchup_split_ingestion.py'
      - 'tests/test_validate_matchup_intelligence.py'
      - 'tests/test_audit_matchup_coverage.py'
      - 'tests/test_matchup_shared_solver.py'
      - 'tests/test_export_matchup_scouting.py'
      - 'tests/test_stage_matchup_backfill.py'
      - 'tests/test_matchup_data_readiness.py'
      - 'tests/test_calibrate_matchup_splits.py'
      - 'tests/test_describe_matchup_metrics.py'
      - 'tests/test_audit_matchup_stability.py'
      - 'tests/test_audit_matchup_descriptive_research.py'
      - 'tests/test_analyze_matchup_percentile_stability.py'
      - 'src/build_adjusted_stats.py'
      - '.github/workflows/matchup-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run feature tests
        run: |
          python -m pytest -q \
            tests/test_matchup_intelligence.py \
            tests/test_build_matchup_intelligence.py \
            tests/test_matchup_split_ingestion.py \
            tests/test_validate_matchup_intelligence.py \
            tests/test_audit_matchup_coverage.py \
            tests/test_matchup_shared_solver.py \
            tests/test_export_matchup_scouting.py \
            tests/test_stage_matchup_backfill.py \
            tests/test_matchup_data_readiness.py \
            tests/test_calibrate_matchup_splits.py \
            tests/test_describe_matchup_metrics.py \
            tests/test_audit_matchup_stability.py \
            tests/test_audit_matchup_descriptive_research.py \
            tests/test_analyze_matchup_percentile_stability.py

  research-percentile-stability:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/matchup-intelligence-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recreate scratch database from preserved CFBD data
        run: |
          python src/bootstrap_league_db.py --backup db/league_backup_before_playoff_migration.db --out db/league.db
          for year in 2025 2026; do python src/load_games.py "data/raw/games_${year}.csv"; done
          python src/patch_known_membership_gaps.py --db db/league.db
          python src/load_membership_snapshot.py data/raw/membership_2026.csv --db db/league.db --year 2026
          for year in 2025 2026; do
            python src/load_game_advanced.py "data/research/matchup_cfbd/game_advanced_${year}.csv" --db db/league.db
          done
          python src/check_matchup_data_readiness.py --db db/league.db --season 2025 --season 2026 > "$RUNNER_TEMP/stability-coverage.json"
      - name: Evaluate 2025 broad-rank sensitivity
        run: |
          python src/analyze_matchup_percentile_stability.py --db db/league.db --season 2025 --as-of 2025-12-31 --sample-size 20 --out "$RUNNER_TEMP/stability-2025.json"
      - name: Evaluate weekly 2026 cohort and opponent sensitivity
        run: |
          python src/analyze_matchup_percentile_stability.py --db db/league.db --season 2026 --as-of 2026-09-26 --as-of 2026-10-10 --as-of 2026-10-31 --sample-size 12 --out "$RUNNER_TEMP/stability-2026.json"
      - name: Save audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchup-weekly-stability
          path: |
            ${{ runner.temp }}/stability-coverage.json
            ${{ runner.temp }}/stability-2025.json
            ${{ runner.temp }}/stability-2026.json
          retention-days: 7
