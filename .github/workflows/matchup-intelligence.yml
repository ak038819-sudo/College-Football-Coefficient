name: Matchup Intelligence (experimental)

on:
  pull_request:
    paths:
      - 'src/matchup_intelligence.py'
      - 'src/build_matchup_intelligence.py'
      - 'src/validate_matchup_intelligence.py'
      - 'src/audit_matchup_coverage.py'
      - 'src/export_matchup_scouting.py'
      - 'src/stage_matchup_backfill.py'
      - 'src/check_matchup_data_readiness.py'
      - 'src/calibrate_matchup_splits.py'
      - 'src/describe_matchup_metrics.py'
      - 'src/audit_matchup_stability.py'
      - 'src/audit_matchup_descriptive_research.py'
      - 'src/analyze_matchup_percentile_stability.py'
      - 'src/audit_matchup_graph_outliers.py'
      - 'src/run_matchup_graph_outlier_audit.py'
      - 'src/matchup_metric_exposure.py'
      - 'src/export_matchup_descriptive.py'
      - 'src/validate_matchup_descriptive_contract.py'
      - 'src/fetch_cfbd_game_advanced.py'
      - 'src/load_game_advanced.py'
      - 'sql/game_advanced_tables.sql'
      - 'tests/test_matchup_intelligence.py'
      - 'tests/test_build_matchup_intelligence.py'
      - 'tests/test_matchup_split_ingestion.py'
      - 'tests/test_validate_matchup_intelligence.py'
      - 'tests/test_audit_matchup_coverage.py'
      - 'tests/test_matchup_shared_solver.py'
      - 'tests/test_export_matchup_scouting.py'
      - 'tests/test_stage_matchup_backfill.py'
      - 'tests/test_matchup_data_readiness.py'
      - 'tests/test_calibrate_matchup_splits.py'
      - 'tests/test_describe_matchup_metrics.py'
      - 'tests/test_audit_matchup_stability.py'
      - 'tests/test_audit_matchup_descriptive_research.py'
      - 'tests/test_analyze_matchup_percentile_stability.py'
      - 'tests/test_audit_matchup_graph_outliers.py'
      - 'tests/test_matchup_metric_exposure.py'
      - 'tests/test_export_matchup_descriptive.py'
      - 'tests/test_validate_matchup_descriptive_contract.py'
      - 'src/build_adjusted_stats.py'
      - '.github/workflows/matchup-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run feature tests
        run: |
          python -m pytest -q \
            tests/test_matchup_intelligence.py \
            tests/test_build_matchup_intelligence.py \
            tests/test_matchup_split_ingestion.py \
            tests/test_validate_matchup_intelligence.py \
            tests/test_audit_matchup_coverage.py \
            tests/test_matchup_shared_solver.py \
            tests/test_export_matchup_scouting.py \
            tests/test_stage_matchup_backfill.py \
            tests/test_matchup_data_readiness.py \
            tests/test_calibrate_matchup_splits.py \
            tests/test_describe_matchup_metrics.py \
            tests/test_audit_matchup_stability.py \
            tests/test_audit_matchup_descriptive_research.py \
            tests/test_analyze_matchup_percentile_stability.py \
            tests/test_audit_matchup_graph_outliers.py \
            tests/test_matchup_metric_exposure.py \
            tests/test_export_matchup_descriptive.py \
            tests/test_validate_matchup_descriptive_contract.py

  # One-off guarded upstream sync. NEVER merges the PR into main.
  sync-main-once:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/matchup-intelligence-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/matchup-intelligence-foundation
          fetch-depth: 0
          persist-credentials: true
      - name: Safely integrate exactly the reviewed main commit
        run: |
          git fetch origin main
          UPSTREAM=$(git rev-parse origin/main)
          if [ "$UPSTREAM" != "f6358a92e11a43809bf9b6e8da65f4f4e7016d15" ]; then
            echo "::error::main changed since the reviewed overlap audit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff origin/main || true
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [ -n "$CONFLICTS" ]; then
            if [ "$CONFLICTS" != "ui/dashboard_shell.html" ]; then
              echo "::error::Unexpected upstream conflicts: $CONFLICTS"
              exit 1
            fi
            # Already reconciled against this exact main commit on the PR:
            # keep our merged shell, NOT any generated or unrelated file.
            git checkout --ours ui/dashboard_shell.html
            git add ui/dashboard_shell.html
          fi
          if [ -n "$(git ls-files -u)" ]; then
            echo "::error::Merge still contains unresolved index entries"
            exit 1
          fi
          git diff --cached --check
          git commit -m "Merge reviewed main into Matchup Intelligence feature branch"
          git push origin HEAD:feature/matchup-intelligence-foundation
