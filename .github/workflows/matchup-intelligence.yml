name: Matchup Intelligence (experimental)

on:
  pull_request:
    paths:
      - 'src/matchup_intelligence.py'
      - 'src/build_matchup_intelligence.py'
      - 'src/validate_matchup_intelligence.py'
      - 'src/audit_matchup_coverage.py'
      - 'src/export_matchup_scouting.py'
      - 'src/stage_matchup_backfill.py'
      - 'src/check_matchup_data_readiness.py'
      - 'src/fetch_cfbd_game_advanced.py'
      - 'src/load_game_advanced.py'
      - 'sql/game_advanced_tables.sql'
      - 'tests/test_matchup_intelligence.py'
      - 'tests/test_build_matchup_intelligence.py'
      - 'tests/test_matchup_split_ingestion.py'
      - 'tests/test_validate_matchup_intelligence.py'
      - 'tests/test_audit_matchup_coverage.py'
      - 'tests/test_matchup_shared_solver.py'
      - 'tests/test_export_matchup_scouting.py'
      - 'tests/test_stage_matchup_backfill.py'
      - 'tests/test_matchup_data_readiness.py'
      - 'src/build_adjusted_stats.py'
      - '.github/workflows/matchup-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run feature tests
        run: |
          python -m pytest -q \
            tests/test_matchup_intelligence.py \
            tests/test_build_matchup_intelligence.py \
            tests/test_matchup_split_ingestion.py \
            tests/test_validate_matchup_intelligence.py \
            tests/test_audit_matchup_coverage.py \
            tests/test_matchup_shared_solver.py \
            tests/test_export_matchup_scouting.py \
            tests/test_stage_matchup_backfill.py \
            tests/test_matchup_data_readiness.py

  # Research-only CFBD pull, triggered ONLY for our same-repo draft feature PR.
  # No git writes; never use pull_request_target or check out untrusted forks.
  stage-real-cfbd:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/matchup-intelligence-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install 'requests>=2.28'
      - name: Stage 2025 and 2026 CFBD split data (no repository writes)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          test -n "$CFBD_API_KEY" || { echo "Missing CFBD_API_KEY; cannot verify data"; exit 1; }
          python src/stage_matchup_backfill.py 2025 2026 --out-dir "$RUNNER_TEMP/elocast-matchup-stage"
      - name: Reconcile staged data against canonical FBS game database
        run: |
          python src/bootstrap_league_db.py --backup db/league_backup_before_playoff_migration.db --out db/league.db
          for year in 2025 2026; do
            python src/load_games.py "data/raw/games_${year}.csv"
          done
          python src/patch_known_membership_gaps.py --db db/league.db
          for year in 2025 2026; do
            if [ -f "data/raw/membership_${year}.csv" ]; then
              python src/load_membership_snapshot.py "data/raw/membership_${year}.csv" --db db/league.db --year "${year}"
            fi
            python src/load_game_advanced.py "$RUNNER_TEMP/elocast-matchup-stage/game_advanced_${year}.csv" --db db/league.db
            python src/audit_matchup_coverage.py --db db/league.db --season "${year}" --output "$RUNNER_TEMP/elocast-matchup-stage/fbs_audit_${year}.json"
          done
          python src/check_matchup_data_readiness.py --db db/league.db --season 2025 --season 2026 > "$RUNNER_TEMP/elocast-matchup-stage/fbs_readiness.json" || echo "Coverage gate blocked: inspect detailed report artifact"
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP']) / "elocast-matchup-stage"
          for year in (2025, 2026):
              d=json.loads((base/f"fbs_audit_{year}.json").read_text())
              print(f"FBS {year}: eligible_games={d['completed_fbs_games']}; membership_gaps={d['missing_membership_games']}; unmatched_rows={d['advanced_rows_unmatched_to_fbs_game_side']}")
              for metric in ('rush_success_rate','rush_ppa','rush_explosiveness','pass_success_rate','pass_ppa','pass_explosiveness'):
                  v=d['metrics'][metric]
                  print(f"  {metric}: paired={v['paired_games']} sides={v['team_games']}")
          gate=json.loads((base/"fbs_readiness.json").read_text())
          print("FBS COVERAGE GATE:",gate['coverage_gate_passed'])
          print("BLOCKERS:",json.dumps(gate['blockers']))
          PY
      - name: Walk-forward evaluate all staged rushing and passing metrics
        run: |
          for year in 2025 2026; do
            for metric in rush_success_rate rush_ppa rush_explosiveness pass_success_rate pass_ppa pass_explosiveness; do
              python src/validate_matchup_intelligence.py --db db/league.db --season "$year" --metric "$metric" > "$RUNNER_TEMP/elocast-matchup-stage/walk_forward_${year}_${metric}.json"
            done
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP']) / 'elocast-matchup-stage'
          for year in (2025,2026):
              for metric in ('rush_success_rate','rush_ppa','rush_explosiveness','pass_success_rate','pass_ppa','pass_explosiveness'):
                  r=json.loads((base/f'walk_forward_{year}_{metric}.json').read_text())
                  model=r['opponent_adjusted']
                  rival=r['matched_team_offense_baseline']
                  print(year,metric,'coverage=',round(r['model_coverage'],3),
                        'matched_n=',model['n'] if model else 0,
                        'adj_MAE=',round(model['mae'],5) if model else None,
                        'prior_offense_MAE=',round(rival['mae'],5) if rival else None)
          PY
      - name: Upload isolated CFBD source and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchup-cfbd-staged-2025-2026
          path: ${{ runner.temp }}/elocast-matchup-stage/
          if-no-files-found: warn
          retention-days: 7
