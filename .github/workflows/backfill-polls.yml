# Fetch every AP and CFP poll release CFBD has, one season at a time.
#
# WHY THIS RUNS HERE. CFBD is unreachable from a development container, so this
# is the only place the endpoint can be called. `poll_rankings` held 325 rows,
# all of 2026, because the only thing that ever fetched a poll was
# src/fetch_cfbd_games.py as a side effect of fetching that season's games --
# and walking ninety seasons through it would re-fetch every game.
#
# NOTHING DOWNSTREAM NEEDS CHANGING. run_pipeline.py already globs every
# data/raw/rankings_*.csv, src/elo_timeline.py already builds a per-season poll
# timeline, and the Top 25 and Week by Week boards already read it. The data is
# the only thing missing, which is why this workflow is the whole change.
#
# Polls are DISPLAY DATA. No rating, selector or Merits figure reads them; see
# sql/rankings_tables.sql.
#
# Resumable: a season whose CSV is already committed is skipped, so a run that
# times out can simply be dispatched again over the same range.
name: Backfill AP and CFP polls

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First season to fetch (the AP poll begins in 1936)"
        required: true
        default: "1936"
      end_year:
        description: "Last season to fetch"
        required: true
        default: "2025"
      probe:
        description: "Report what the endpoint returns; write nothing"
        type: boolean
        required: false
        default: false
      force:
        description: "Re-fetch seasons whose CSV is already committed"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Shares the deploy's lock because it pushes to main and writes data/raw,
    # which the scheduled refresh also rewrites.
    concurrency:
      group: rebuild-and-deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Report what the endpoint actually returns
        if: ${{ inputs.probe }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          START: ${{ inputs.start_year }}
          END: ${{ inputs.end_year }}
        run: |
          set -euo pipefail
          if [ -z "${CFBD_API_KEY:-}" ]; then
            echo "::error::CFBD_API_KEY is not set for this repository."
            exit 1
          fi
          python3 src/fetch_cfbd_rankings.py --probe "$START" "$END"

      - name: Fetch and commit one season at a time
        if: ${{ !inputs.probe }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          START: ${{ inputs.start_year }}
          END: ${{ inputs.end_year }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${CFBD_API_KEY:-}" ]; then
            echo "::error::CFBD_API_KEY is not set for this repository."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          flags=""
          if [ "$FORCE" = "true" ]; then flags="--force"; fi
          # One season per commit, pushed as it lands, so a timeout or a CFBD
          # outage costs the season in flight rather than the whole backfill.
          for year in $(seq "$START" "$END"); do
            echo "::group::season $year"
            # Checked explicitly: `set -e` does NOT stop a shell loop, and a
            # season that failed must halt the run rather than be skipped while
            # later seasons commit on top of the gap.
            if ! python3 src/fetch_cfbd_rankings.py "$year" $flags; then
              echo "::endgroup::"
              echo "::error::Season $year failed. Earlier seasons are committed; re-run this workflow from $year to resume."
              exit 1
            fi
            path="data/raw/rankings_$year.csv"
            # A season with no release writes no file: the AP poll did not
            # exist before 1936 and was not published in some wartime seasons.
            # That is a fact about the sport, not a failure.
            if [ ! -f "$path" ]; then
              echo "Season $year produced no file; CFBD has no poll release for it."
              echo "::endgroup::"
              continue
            fi
            if git diff --quiet -- "$path" && git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "Season $year is unchanged; nothing to publish."
              echo "::endgroup::"
              continue
            fi
            if ! scripts/publish_to_main.sh "Archive $year AP and CFP polls [skip ci]" "$path"; then
              echo "::endgroup::"
              echo "::error::Could not publish season $year. Nothing was published for it; re-run this workflow from $year."
              exit 1
            fi
            echo "::endgroup::"
          done

      # Read off the files this job wrote. It never builds a database, so the
      # summary must come from the CSVs themselves.
      - name: Summarise the backfill
        if: ${{ always() && !inputs.probe }}
        run: |
          python3 - <<'PY'
          import csv, pathlib
          paths = sorted(pathlib.Path('data/raw').glob('rankings_*.csv'))
          total = 0
          polls_seen = {}
          for path in paths:
              season = path.stem.replace('rankings_', '')
              rows = list(csv.DictReader(path.open(encoding='utf-8')))
              total += len(rows)
              releases = {(r['poll'], r['season_type'], r['week']) for r in rows}
              by_poll = sorted({r['poll'] for r in rows})
              for poll in by_poll:
                  polls_seen.setdefault(poll, []).append(int(season))
              print(f'{season}: {len(rows)} rows, {len(releases)} releases, '
                    f"polls {','.join(by_poll)}")
          print(f'total: {total:,} rows over {len(paths)} seasons')
          for poll, seasons in sorted(polls_seen.items()):
              print(f'  {poll}: {min(seasons)}-{max(seasons)}, {len(seasons)} seasons')
          PY
