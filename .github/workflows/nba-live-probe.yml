name: Probe the NBA live scoreboard

# Read-only. Measures whether an Actions runner can reach ESPN's public NBA
# scoreboard, and how far behind the nightly refresh's Parquet source is.
# Nothing is committed and nothing published is touched.

on:
  workflow_dispatch: {}
  push:
    branches: [claude/project-thread-pgh71u]
    paths:
      - '.github/workflows/nba-live-probe.yml'
      - 'scripts/probe_nba_live.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the Parquet reader
        run: python -m pip install 'pyarrow>=14.0'
      - name: Probe the scoreboard
        run: |
          set -o pipefail
          python scripts/probe_nba_live.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Measure how stale the Parquet source is
        run: |
          set -o pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys
          sys.path.insert(0, '.')
          import pyarrow.parquet as pq
          from src.nba import source
          path = source.fetch('schedule', 2027)
          table = pq.read_table(path)
          names = set(table.column_names)
          print('columns present:', sorted(n for n in names if 'status' in n or 'date' in n))
          rows = table.to_pylist()
          done = [r for r in rows if r.get('status_type_completed')]
          print(f'{len(rows)} scheduled rows, {len(done)} completed')
          print('newest completed game_date:', max(r['game_date'] for r in done))
          print('newest scheduled game_date:', max(r['game_date'] for r in rows))
          PY
