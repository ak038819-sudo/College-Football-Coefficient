name: Historical backfill audit tests

on:
  pull_request:
    paths:
      - 'scripts/audit_historical_backfill.py'
      - 'tests/test_historical_backfill_audit.py'
      - '.github/workflows/historical-backfill-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile audit and tests
        run: python -m compileall -q scripts/audit_historical_backfill.py tests/test_historical_backfill_audit.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test backfill audit
        run: python -m pytest tests/test_historical_backfill_audit.py -q
