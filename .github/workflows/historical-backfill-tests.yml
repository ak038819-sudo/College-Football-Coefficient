name: Historical backfill audit tests

on:
  pull_request:
    paths:
      - 'scripts/audit_historical_backfill.py'
      - 'scripts/reconcile_historical_sources.py'
      - 'scripts/build_historical_identity_map.py'
      - 'scripts/build_historical_eligibility.py'
      - 'scripts/audit_historical_preservation.py'
      - 'scripts/probe_early_football_coverage.py'
      - 'scripts/import_historical_archive.py'
      - 'tests/test_historical_backfill_audit.py'
      - 'tests/test_historical_backfill_workflow.py'
      - 'tests/test_historical_reconcile.py'
      - 'tests/test_historical_identity_map.py'
      - 'tests/test_historical_eligibility.py'
      - 'tests/test_historical_preservation.py'
      - 'tests/test_early_football_probe.py'
      - '.github/workflows/historical-backfill-tests.yml'
      - '.github/workflows/historical-backfill.yml'
      - '.github/workflows/historical-reconcile.yml'
      - '.github/workflows/historical-identity.yml'
      - '.github/workflows/historical-preservation.yml'
      - '.github/workflows/early-football-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile the scripts and their tests
        run: |
          python -m compileall -q \
            scripts/audit_historical_backfill.py \
            scripts/import_historical_archive.py \
            scripts/reconcile_historical_sources.py \
            scripts/build_historical_identity_map.py \
            scripts/build_historical_eligibility.py \
            scripts/audit_historical_preservation.py \
            scripts/probe_early_football_coverage.py \
            tests/test_historical_backfill_audit.py \
            tests/test_historical_backfill_workflow.py \
            tests/test_historical_reconcile.py \
            tests/test_historical_identity_map.py \
            tests/test_historical_eligibility.py \
            tests/test_historical_preservation.py \
            tests/test_early_football_probe.py
      - name: Install pytest
        # PyYAML too: the workflow test reads the backfill workflow as data,
        # and `importorskip` would otherwise skip it into silence here.
        run: python -m pip install pytest PyYAML
      - name: Test the backfill audit, the reconciliation and their workflows
        run: |
          python -m pytest tests/test_historical_backfill_audit.py \
            tests/test_historical_backfill_workflow.py \
            tests/test_historical_reconcile.py \
            tests/test_historical_identity_map.py \
            tests/test_historical_eligibility.py \
            tests/test_historical_preservation.py \
            tests/test_early_football_probe.py -q
