      // day strip, the filters and the cards are all hidden together, and
      // `[hidden]` only wins because ui/game_page.css makes it `!important`:
      // `.cards` is a grid and `.days` is a flex row, so either display rule
      // would otherwise beat the attribute and leave a whole day of cards on
      // screen beneath the open game.
      var open = Boolean(state.game);
      el('days').hidden = open;
      el('filters').hidden = open;
      el('sorts').hidden = open;
      el('cards').hidden = open;
      el('game-page').hidden = !open;
      if (open) {
        var page = el('game-page');
        page.className = 'gamepage';
        page.innerHTML = '';
        renderGame(page);
      } else {
        renderDays();
        renderFilters();
        renderSorts();
        renderCards();
      }
    }
  }

  function load(src) {
    return new Promise(function (resolve, reject) {
      var script = document.createElement('script');
      script.src = src;
      script.onload = resolve;
      script.onerror = function () { reject(new Error('failed: ' + src)); };
      document.head.appendChild(script);
    });
  }

  /* Today, in the calendar this export states its game days in.
   *
   * NOT the UTC date. A 7pm Eastern tip-off is already midnight UTC, so for
   * the whole of every evening the UTC date is tomorrow -- and reading it as
   * today opened the scoreboard on the next day's schedule while the games
   * on it were being played.
   */
  function today() {
    return app.todayKey(undefined, app.NCAAMBB_DAY_ZONE);
  }

  function openingDay(payload) {
    // Today, clamped into the loaded season. Not the last date in the
    // payload: a published schedule runs to April, so that opened on the
    // championship and the strip called it Today.
    return app.openingDay(
      ((payload && payload.games) || []).map(app.dayOf).filter(Boolean),
      today());
  }

  function start() {
    leagueButtons();
    var opening = tabFromHash();
    if (opening) state.tab = opening;
    state.team = teamIdFromHash();
    state.player = playerIdFromHash();
    state.game = gameIdFromHash();
    state.gameSeason = state.game ? gameSeasonFromHash() : null;
    window.addEventListener('hashchange', function () {
      var changed = false;
      var next = tabFromHash();
      if (next && next !== state.tab) { state.tab = next; changed = true; }
      // The club is read from the URL and nowhere else, so a link and the
      // back button cannot disagree about which club is open.
      var club = teamIdFromHash();
      if (club !== state.team) { state.team = club; changed = true; }
      var person = playerIdFromHash();
      if (person !== state.player) { state.player = person; changed = true; }
      // The open game comes from the URL and nowhere else, so a link, the
      // back button and a pressed card cannot disagree about it.
      var game = gameIdFromHash();
      if (game !== state.game) { state.game = game; changed = true; }
      var gameSeason = game ? gameSeasonFromHash() : null;
      if (gameSeason !== state.gameSeason) {
        state.gameSeason = gameSeason;
        changed = true;
      }
      if (changed) render();
    });
    fetch(BASE + 'manifest.json', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('no manifest');
        return response.json();
      })
      .then(function (manifest) {
        state.manifest = manifest;
        state.verdict = loader.accept(manifest);
        if (!state.verdict.ok) {
          render();
          return null;
        }
        state.season = manifest.latest_season;
        var sources = [loader.fileSource(manifest, 'teams', BASE),
                       loader.seasonSource(manifest, state.season, BASE)]
          .filter(Boolean);
        return Promise.all(sources.map(load));
      })
      .then(function () {
        if (!state.verdict || !state.verdict.ok) return;
        state.day = openingDay(seasonPayload());
        render();
      })
      .catch(function (error) {
        state.verdict = {
          ok: false,
          reasons: ['The basketball export could not be loaded: '
                    + error.message],
          stale: true,
          age: { label: 'last updated: unknown', known: false, minutes: null }
        };
        render();
      });
  }

  start();
}());
</script>
</body>
</html>
