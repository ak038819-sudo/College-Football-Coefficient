<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elocast — Men's Basketball preview</title>
<!--
  B05: the unlinked basketball preview.

  Unlinked on purpose. Nothing on the football site points here, the football
  page is not modified, and release gate 6 decides whether a reader can ever
  reach it. It exists so the interface contract in docs/basketball-ui.md can be
  looked at and argued with before anything is published.

  It draws nothing until ui/ncaambb_loader.js accepts the manifest. A sample,
  an unknown schema, a model with no held-out score or a manifest naming a
  file that is not there produces the refusal panel and no board, which is the
  behaviour release gate 4 asks for.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700;800&family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* The same tokens as ui/dashboard_shell.html: the contract is that the look
     carries across sports without a redesign. */
  :root {
    --bg: #0e1512;
    --panel: #161f1a;
    --panel-2: #1c2621;
    --line: #2a352e;
    --ink: #eef1ec;
    --ink-dim: #a8b3ac;
    --amber: #e8a33d;
    --amber-dim: #7a5a26;
    --red: #c4453c;
    --red-ink: #d16e67;
    --green-hl: #6fae5a;
    --font-display: 'Roboto Slab', Georgia, serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f2f0e8; --panel: #ffffff; --panel-2: #eae7dc; --line: #d8d4c6;
      --ink: #1a1f1b; --ink-dim: #5c6259; --amber: #8f5c15;
      --amber-dim: #e8c68f; --red: #a3352c; --red-ink: #a3352c; --green-hl: #3b732d;
    }
  }
  :root[data-theme="light"] {
    --bg: #f2f0e8; --panel: #ffffff; --panel-2: #eae7dc; --line: #d8d4c6;
    --ink: #1a1f1b; --ink-dim: #5c6259; --amber: #8f5c15;
    --amber-dim: #e8c68f; --red: #a3352c; --red-ink: #a3352c; --green-hl: #3b732d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased;
  }
  /* The foot of the page only needs clearing where the tab bar is fixed
     over it, which is phone width alone. */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  @media (max-width: 719px) { .wrap { padding-bottom: 96px; } }
  h1 {
    font-family: var(--font-display); font-weight: 800; margin: 0;
    font-size: clamp(26px, 5vw, 40px); letter-spacing: 0.5px;
  }
  .preview-note {
    font-size: 12px; color: var(--amber); text-transform: uppercase;
    letter-spacing: 1.2px; margin: 6px 0 0;
  }

  /* 1. The league selector, directly beneath the wordmark. A segmented
        control while there are two choices. */
  .leagues {
    display: inline-flex; margin: 14px 0 0; border: 1px solid var(--line);
    border-radius: 999px; overflow: hidden; background: var(--panel);
  }
  .leagues button {
    appearance: none; border: 0; background: transparent; color: var(--ink-dim);
    font: inherit; font-size: 14px; padding: 8px 16px; cursor: pointer;
  }
  .leagues button[aria-pressed="true"] {
    background: var(--amber); color: var(--bg); font-weight: 600;
  }
  .search { margin: 12px 0 0; }
  .search input {
    width: 100%; max-width: 420px; padding: 9px 12px; font: inherit;
    color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px;
  }

  .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
          margin: 14px 0 0; font-size: 13px; color: var(--ink-dim); }
  .badge {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.6px;
    text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--line);
  }
  /* Stale is a badge that cannot be mistaken for a timestamp. */
  .badge.stale { background: var(--red); border-color: var(--red);
                 color: #fff; font-weight: 600; }
  .badge.fresh { color: var(--green-hl); border-color: var(--green-hl); }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; margin: 18px 0 0;
  }
  .refusal { border-color: var(--red); }
  .refusal h2 { margin: 0 0 8px; font-size: 16px; color: var(--red-ink); }
  .refusal ul { margin: 0; padding-left: 20px; font-size: 14px; }

  .days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .days button {
    appearance: none; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--ink-dim); font: inherit; font-size: 12px; padding: 6px 10px;
    border-radius: 8px; white-space: nowrap; cursor: pointer;
  }
  .days button[aria-pressed="true"] {
    border-color: var(--amber); color: var(--ink); font-weight: 600;
  }
  .filters { display: flex; gap: 6px; margin: 10px 0 0; flex-wrap: wrap; }
  .filters button {
    appearance: none; border: 1px solid var(--line); background: transparent;
    color: var(--ink-dim); font: inherit; font-size: 12px; padding: 5px 10px;
    border-radius: 999px; cursor: pointer;
  }
  .filters button[aria-pressed="true"] { color: var(--ink);
                                         border-color: var(--ink); }

  .cards { display: grid; gap: 10px; margin: 12px 0 0;
           grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
          background: var(--panel-2); }
  .card .status { font-size: 11px; text-transform: uppercase;
                  letter-spacing: 0.8px; color: var(--ink-dim); }
  .card .side { display: flex; justify-content: space-between; gap: 10px;
                font-size: 15px; margin-top: 4px; }
  .card .side .pts { font-family: var(--font-mono); }
  .card .foot { font-size: 11px; color: var(--ink-dim); margin-top: 6px; }
  .undecided { color: var(--amber); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px;
           border-bottom: 1px solid var(--line); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
       color: var(--ink-dim); }
  td.num, th.num { text-align: right; font-family: var(--font-mono); }
  td.rk { text-align: center; width: 44px; color: var(--ink-dim); }

  /* 4. The tabs keep their names and change their contents. They sit under
        the wordmark on a desktop, as college football's and the NFL's do,
        and become the phone's bottom bar below 720px. This page was built
        phone-first and shipped with the fixed bar and NO media query, so a
        2000px window wore a row of five stranded across the foot of the
        screen -- the same defect the NFL page had, fixed the same way. */
  nav.tabs {
    display: flex; gap: 2px; margin: 14px 0 0;
    border-bottom: 1px solid var(--line);
  }
  nav.tabs button {
    appearance: none; border: 0; background: transparent;
    color: var(--ink-dim); font: inherit; font-size: 14px;
    padding: 8px 12px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  nav.tabs button:hover:not([disabled]) { color: var(--ink); }
  nav.tabs button[aria-pressed="true"] { color: var(--amber);
                                         font-weight: 600;
                                         border-bottom-color: var(--amber); }
  nav.tabs button[disabled] { opacity: 0.35; cursor: default; }

  @media (max-width: 719px) {
    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
      margin: 0; gap: 0; border-bottom: 0;
      background: var(--panel); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav.tabs button {
      flex: 1; font-size: 12px; padding: 10px 4px;
      border-bottom: 0; margin-bottom: 0;
    }
    nav.tabs button[aria-pressed="true"] { border-bottom-color: transparent; }
  }
  .empty { color: var(--ink-dim); font-size: 14px; }

  /* A school's mark sits in a fixed box in front of its name, so a row of
     clubs has its names on one left edge whether a mark exists or not. The
     box is sized in px rather than in percent: a percentage padding would
     resolve against the containing block and give one logo twenty pixels in
     a wide table cell and two in a narrow one, which is a trap the football
     side already fell into. */
  .named { display: inline-flex; align-items: center; gap: 8px;
           min-width: 0; }
  .logo-mark {
    width: 20px; height: 20px; flex: 0 0 20px; object-fit: contain;
    display: inline-block;
  }
  .clubtitle .logo-mark { width: 28px; height: 28px; flex-basis: 28px; }
  .card .side .named { gap: 6px; }

  /* 5. A club's own page: a directory to reach it and a header over its
        season. `link` is a button that reads as a link, so a club name is
        the same control wherever it appears. */
  button.link {
    appearance: none; border: 0; background: transparent; padding: 0;
    font: inherit; color: inherit; cursor: pointer; text-align: left;
    border-bottom: 1px solid transparent;
  }
  button.link:hover, button.link:focus-visible {
    border-bottom-color: var(--amber); color: var(--ink);
  }
  .back { margin: 0 0 10px; }
  .clubhead { display: flex; justify-content: space-between; gap: 12px;
              align-items: baseline; flex-wrap: wrap; margin: 0 0 12px; }
  .clubhead h2 { margin: 0; font-size: 20px; }
  .clubhead .sub { font-size: 12px; color: var(--ink-dim); }
  .clubhead .num { font-family: var(--font-mono); font-size: 15px; }
  .directory { margin: 0 0 18px; }
  .directory h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase;
                  letter-spacing: 0.8px; color: var(--ink-dim); }
  .directory ul { list-style: none; margin: 0; padding: 0; display: grid;
                  gap: 2px 14px;
                  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .directory li { font-size: 14px; display: flex;
                  justify-content: space-between; gap: 8px; }
  .directory .rating { font-family: var(--font-mono); color: var(--ink-dim); }
  .scroller { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Elocast</h1>
    <p class="preview-note">Men's Basketball</p>
    <div class="leagues" id="leagues" role="group"
         aria-label="League"></div>
    <div class="search">
      <input id="search" type="search" aria-label="Search">
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections"></nav>

  <div class="panel refusal" id="refusal" hidden>
    <h2>These ratings are not being shown</h2>
    <ul id="refusal-list"></ul>
  </div>

  <section class="panel" id="scoreboard" hidden>
    <div class="days" id="days"></div>
    <div class="filters" id="filters"></div>
    <div class="filters" id="sorts" aria-label="Order"></div>
    <div class="cards" id="cards"></div>
  </section>

  <section class="panel" id="teams" hidden>
    <div id="team-body"></div>
  </section>

  <section class="panel" id="people" hidden>
    <div id="people-body"></div>
  </section>

  <section class="panel" id="standings" hidden>
    <table>
      <thead>
        <tr><th class="rk">#</th><th>Team</th><th>Conference</th>
            <th class="num">Rating</th><th class="num">Record</th></tr>
      </thead>
      <tbody id="board"></tbody>
    </table>
    <p class="empty" id="board-note" hidden></p>
  </section>
</div>

<script src="ncaambb_loader.js?v=35cff06570f1"></script>
<script src="ncaambb_app.js?v=b351d84954f4"></script>
<script>
(function () {
  'use strict';
  var loader = window.ncaambbLoader;
  var app = window.ncaambbApp;
  var BASE = 'data/ncaambb/';
  // Which panel each tab shows. A league having a section is not the same as
  // this page having a panel for it: basketball genuinely holds teams and
  // people, and switchLeague is right to carry those sections, but the
  // preview draws only the board and the scoreboard. A tab with no panel
  // behind it hid both and left an empty page, which is the thing the Stats
  // tab is deliberately disabled to avoid.
  //
  // The tabs themselves, and their names and order, come from the shared
  // registry: every league shows the same five. This page used to draw six,
  // because Games had a tab of its own while drawing the scoreboard that
  // Home draws.
  var PANELS = { home: 'scoreboard', standings: 'standings',
                 teams: 'teams', people: 'people' };
  // Sections this page no longer names in a URL but must keep opening,
  // because links to them are published.
  var LEGACY = { games: 'home' };
  // What a URL naming no section means: the ratings board, which is what the
  // preview is for. It is a constant because the route code and the initial
  // state have to agree about it -- see tabFromHash.
  var DEFAULT_TAB = 'standings';
  var state = { manifest: null, verdict: null, season: null, day: null,
                filter: 'all', sort: 'best', tab: DEFAULT_TAB,
                team: null, query: '', player: null, playerQuery: '',
                // Which people files have been asked for, so a panel that
                // re-renders does not re-fetch, and a file that failed is
                // not retried forever on every keystroke.
                people: {}, peopleError: null };

  /* A club in a URL is the provider's id and not the whole key:
   * `#league=ncaambb&section=teams&team=18`, not
   * `...&team=ncaambb%3Acbbd%3Ateam%3A18`. The prefix is the export's
   * business, so a short id is resolved against the season's own teams
   * rather than by putting the prefix back on.
   */
  function shortTeamId(key) {
    var parts = String(key || '').split(':');
    return parts[parts.length - 1];
  }

  function el(id) { return document.getElementById(id); }

  /* A tab is a route, not just a pressed button. Without this, every tab but
   * the one the page opens on was unreachable by link, by reload and by the
   * back button -- the Standings a reader wanted to share opened on whatever
   * the page defaults to.
   *
   * The hash is the shared one, written by ncaambb_app.writeRoute, so a
   * basketball section link is the same string switchLeague would produce:
   * `#league=ncaambb&section=standings`, and home states no section.
   */
  function routableTab(name) {
    return app.tabLabel(name) !== null && Boolean(PANELS[name]);
  }

  function tabFromHash() {
    var hash = String(window.location.hash || '').replace(/^#/, '');
    // A URL naming no league at all is this page's bare URL: the first
    // history entry, and what Back returns to after the first tab press. It
    // asks for nothing, so it asks for the default -- and it has to say so
    // rather than null, or Back left the previous tab drawn under a URL that
    // reloads as the default. readRoute cannot tell this case apart for us,
    // because a hash with no league IS football as far as the shared route
    // is concerned, and that is the right answer everywhere but here.
    if (!/(^|&)league=/.test(hash)) return DEFAULT_TAB;
    var route = app.readRoute(hash);
    // A hash naming another league is not this page's to read. It cannot
    // happen by navigation, but a hand-edited link can say it.
    if (route.league !== app.BASKETBALL) return null;
    var section = route.params.section || 'home';
    if (LEGACY[section]) section = LEGACY[section];
    // An unroutable section -- a disabled tab, or a name this page has no
    // panel for -- leaves the tab alone rather than opening an empty panel.
    return routableTab(section) ? section : null;
  }

  /* The club id a link names, or null. Only inside Teams: a `team` left on
   * a URL whose section is Standings would draw a club behind the board. */
  function teamIdFromHash() {
    var hash = String(window.location.hash || '').replace(/^#/, '');
    if (!/(^|&)league=/.test(hash)) return null;
    var route = app.readRoute(hash);
    if (route.league !== app.BASKETBALL) return null;
    if ((route.params.section || 'home') !== 'teams') return null;
    return route.params.team ? String(route.params.team) : null;
  }

  function writeTeam(id) {
    var route = app.readRoute(window.location.hash);
    var params = {};
    Object.keys(route.params).forEach(function (key) {
      if (key !== 'section' && key !== 'team') params[key] = route.params[key];
    });
    params.section = 'teams';
    if (id) params.team = id;
    var hash = app.writeRoute({ league: app.BASKETBALL, params: params });
    if (hash !== window.location.hash) window.location.hash = hash;
  }

  function playerIdFromHash() {
    var hash = String(window.location.hash || '').replace(/^#/, '');
    if (!/(^|&)league=/.test(hash)) return null;
    var route = app.readRoute(hash);
    if (route.league !== app.BASKETBALL) return null;
    if ((route.params.section || 'home') !== 'people') return null;
    return route.params.player ? String(route.params.player) : null;
  }

  function writePlayer(id) {
    var route = app.readRoute(window.location.hash);
    var params = {};
    Object.keys(route.params).forEach(function (key) {
      if (key !== 'section' && key !== 'player') {
        params[key] = route.params[key];
      }
    });
    params.section = 'people';
    if (id) params.player = id;
    var hash = app.writeRoute({ league: app.BASKETBALL, params: params });
    if (hash !== window.location.hash) window.location.hash = hash;
  }

  function writeTab(name) {
    var route = app.readRoute(window.location.hash);
    var params = {};
    // Every other parameter is kept: the day and the filter belong to the
    // reader, not to the tab they happen to press.
    Object.keys(route.params).forEach(function (key) {
      if (key !== 'section') params[key] = route.params[key];
    });
    // A club page is open INSIDE the Teams section, so leaving that section
    // takes the club out of the URL with it. Pressing Teams again keeps it,
    // which is what makes the tab a way back.
    if (name !== 'teams') delete params.team;
    // A player page is open INSIDE the People section, the same way a club
    // page is inside Teams.
    if (name !== 'people') delete params.player;
    if (name !== 'home') params.section = name;
    var hash = app.writeRoute({ league: app.BASKETBALL, params: params });
    // Pressing the same tab twice must not cost a second Back to leave.
    // Chromium pushes no entry for an assignment that leaves the URL the
    // same (measured 2026-10-27), so this guard is what makes that true
    // anywhere a browser is less careful, not what makes it true here.
    if (hash !== window.location.hash) window.location.hash = hash;
  }

  function text(node, value) {
    node.textContent = value === null || value === undefined ? '' : value;
  }

  function leagueButtons() {
    var host = el('leagues');
    host.innerHTML = '';
    // Only the launched leagues, plus this one, which is always included so
    // the control has something pressed on the page drawing it.
    app.launchedLeagues(app.BASKETBALL).forEach(function (entry) {
      var button = document.createElement('button');
      button.type = 'button';
      button.textContent = entry.picker;
      // The tab says NCAAF, NCAAM, NFL. An abbreviation is a poor accessible
      // name on its own, so the spelled-out league comes with it.
      button.title = entry.pickerTitle;
      button.setAttribute('aria-label', entry.pickerTitle);
      button.dataset.league = entry.slug;
      // Football lives on dashboard.html; this preview is basketball only, so
      // the football option navigates rather than pretending to switch here.
      button.setAttribute('aria-pressed',
        entry.slug === app.BASKETBALL ? 'true' : 'false');
      button.addEventListener('click', function () {
        if (entry.slug === app.BASKETBALL) return;
        window.location.href = 'dashboard.html';
      });
      host.appendChild(button);
    });
    el('search').placeholder = app.searchPlaceholder(app.BASKETBALL);
    // The header's search box finds clubs. It took typing and did nothing
    // at all until now, which is worse than having no box: a reader cannot
    // tell a control that found nothing from one that was never wired.
    //
    // It is the one search box on the page, so it takes the reader to the
    // Teams tab rather than growing a second box inside it -- the pattern
    // the NFL page already uses for players.
    el('search').addEventListener('input', function () {
      state.query = el('search').value;
      // A search is a fresh choice, not a filter over the club already
      // open: leaving that club drawn would hide the results behind it.
      state.team = null;
      if (state.verdict && state.verdict.ok) {
        state.tab = 'teams';
        // writeTeam, not writeTab: pressing the Teams tab keeps the club
        // in the URL, which is right for a tab and wrong here. Typing left
        // `team=1` on an address showing search results -- the page and
        // the URL saying different things, which is the one thing the
        // route is for.
        writeTeam(null);
      }
      render();
    });
  }

  function tabButtons() {
    var host = el('tabs');
    host.innerHTML = '';
    app.tabs().forEach(function (pair) {
      var name = pair[0];
      var button = document.createElement('button');
      button.type = 'button';
      button.textContent = pair[1];
      button.dataset.tab = name;
      var ready = routableTab(name);
      // A feature appears only where it is ready. Stats carries nothing until
      // Player Impact or Roster Scenarios exists, so it is shown disabled
      // rather than opening an empty panel.
      if (!ready) button.disabled = true;
      button.setAttribute('aria-pressed',
        String(name === state.tab && ready));
      button.addEventListener('click', function () {
        if (!ready) return;
        state.tab = name;
        // The hash first, so the hashchange it fires finds the state it
        // describes and re-renders nothing twice.
        writeTab(name);
        render();
      });
      host.appendChild(button);
    });
  }

  function describeModel(model) {
    if (!model) return '';
    return 'Elo ' + model.name + ', held out '
      + (model.held_out || []).join(', ') + ' · Brier '
      + Number(model.holdout_brier).toFixed(5);
  }

  function renderMeta() {
    var host = el('meta');
    host.innerHTML = '';
    var verdict = state.verdict;
    if (!verdict) return;
    var badge = document.createElement('span');
    badge.className = 'badge ' + (verdict.stale ? 'stale' : 'fresh');
    badge.textContent = verdict.stale
      ? 'Stale · ' + verdict.age.label : verdict.age.label;
    host.appendChild(badge);
    if (state.season) {
      var season = document.createElement('span');
      season.textContent = app.seasonLabel(state.season);
      host.appendChild(season);
    }
    if (verdict.model) {
      var model = document.createElement('span');
      model.textContent = describeModel(verdict.model);
      host.appendChild(model);
    }
  }

  function renderRefusal() {
    var host = el('refusal');
    var list = el('refusal-list');
    list.innerHTML = '';
    var reasons = (state.verdict && state.verdict.reasons) || [];
    host.hidden = reasons.length === 0;
    reasons.forEach(function (reason) {
      var item = document.createElement('li');
      item.textContent = reason;
      list.appendChild(item);
    });
  }

  function teamName(key) {
    var teams = window.NCAAMBB_TEAMS || {};
    var team = teams[key];
    return (team && (team.short || team.name)) || key;
  }

  /* A school's mark, drawn beside its name.
   *
   * The file is named from the id the export carries and nothing else, so
   * there is one path in this page and no manifest to keep in step. The two
   * cuts are the provider's: the plain one is dark ink for a light page, the
   * `-dark` one is light ink for this page's own dark theme, which is why
   * the <img> -- what a browser falls back to -- is the dark cut.
   *
   * A club with no mark gets an EMPTY box of the same size, not its
   * initials: a cell holding a mark and a name should read as the name
   * alone when it is copied or spoken, and "BYUBYU" is what initials in
   * front of a name actually produce. That covers every non-Division I
   * opponent, which the provider sends no logo for, and any school whose
   * file has not been banked yet -- an <img> that fails is replaced in
   * place, so a page served before the marks are fetched reads exactly as
   * it did before this existed rather than showing 365 broken images.
   */
  var LOGO_BASE = 'assets/ncaambb/';

  function blankMark() {
    var span = document.createElement('span');
    span.className = 'logo-mark blank';
    span.setAttribute('aria-hidden', 'true');
    return span;
  }

  function logoMark(key) {
    var teams = window.NCAAMBB_TEAMS || {};
    var team = teams[key];
    var id = team && team.logo;
    if (!id) return blankMark();
    var picture = document.createElement('picture');
    var light = document.createElement('source');
    light.media = '(prefers-color-scheme: light)';
    light.srcset = LOGO_BASE + id + '.png';
    var img = document.createElement('img');
    img.className = 'logo-mark';
    img.src = LOGO_BASE + id + '-dark.png';
    img.alt = '';
    img.loading = 'lazy';
    img.addEventListener('error', function () {
      if (picture.parentNode) {
        picture.parentNode.replaceChild(blankMark(), picture);
      }
    });
    picture.appendChild(light);
    picture.appendChild(img);
    return picture;
  }

  /* A club's name with its mark in front of it, as one element. Every screen
   * that names a club uses this, so a logo cannot appear on one board and
   * not on another.
   */
  function named(key, label) {
    var span = document.createElement('span');
    span.className = 'named';
    span.appendChild(logoMark(key));
    var text = document.createElement('span');
    text.textContent = label === undefined ? teamName(key) : label;
    span.appendChild(text);
    return span;
  }

  function seasonPayload(season) {
    var seasons = window.NCAAMBB_SEASONS || {};
    // A player's career crosses seasons, and only the season the page opened
    // on is loaded. An absent season returns null and the dates fall back to
    // an em dash rather than the page guessing at them.
    return seasons[season === undefined ? state.season : season] || null;
  }

  function renderBoard() {
    var body = el('board');
    body.innerHTML = '';
    var payload = seasonPayload();
    var rows = (payload && payload.board) || [];
    rows.slice(0, 50).forEach(function (row) {
      var tr = document.createElement('tr');
      function cell(value, className) {
        var td = document.createElement('td');
        if (className) td.className = className;
        text(td, value);
        tr.appendChild(td);
      }
      cell(row.rank, 'rk');
      var nameCell = document.createElement('td');
      nameCell.appendChild(named(row.team));
      tr.appendChild(nameCell);
      cell(row.conference);
      cell(app.ratingText(row.rating), 'num');
      // A club that has not played yet has no record to show. "0-0" would
      // read as a measurement, and its rating is last season's carried over
      // rather than anything this season has decided.
      // Whether a RECORD exists, not whether a rating counted anything.
      // The board's wins and losses count every opponent while the rating
      // counts Division I games alone, so a club whose only final was
      // against a non-Division I opponent is 1-0 with no rated game -- and
      // keying this on rated_games put an em dash over a real record.
      cell(row.wins || row.losses ? row.wins + '-' + row.losses : '\u2014',
           'num');
      body.appendChild(tr);
    });
    carriedNote(rows);
    if (!rows.length) {
      var tr = document.createElement('tr');
      var td = document.createElement('td');
      td.colSpan = 5;
      td.className = 'empty';
      td.textContent = 'No ratings are loaded for this season.';
      tr.appendChild(td);
      body.appendChild(tr);
    }
  }

  /* How many of this board's ratings are carried rather than earned, said
   * once under the table. Early in a season most of them are last season's,
   * and a ranked table that does not say so reads as results.
   *
   * The condition is a club with no RATED game, and the wording has to say
   * that rather than "has not played": a club can have played a non-Division
   * I opponent, and have a win to show for it, while its rating has still
   * learned nothing. Saying it had not played contradicted its own record on
   * the same row.
   */
  function carriedNote(rows) {
    var host = el('board-note');
    if (!host) return;
    var waiting = rows.filter(function (row) {
      return !row.rated_games;
    }).length;
    if (!waiting) { host.textContent = ''; host.hidden = true; return; }
    host.hidden = false;
    host.textContent = waiting === rows.length
      ? 'No club has a Division I result yet. Every rating here is last '
        + 'season\u2019s, carried over.'
      : waiting + ' of these ' + rows.length + ' clubs have no Division I '
        + 'result yet, and carry last season\u2019s rating.';
  }

  /* ---- the club directory, and a club's own page -------------------- */

  function teamLink(key) {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'link';
    button.appendChild(named(key));
    button.dataset.team = shortTeamId(key);
    button.addEventListener('click', function () {
      state.team = shortTeamId(key);
      window.scrollTo(0, 0);
      writeTeam(state.team);
      render();
    });
    return button;
  }

  /* The board row for the club a short id names, or null. The board is the
   * list of Division I teams this season, so a club that did not play --
   * or an id nobody published -- simply has no page. */
  function boardRow(id) {
    var payload = seasonPayload();
    var rows = (payload && payload.board) || [];
    for (var index = 0; index < rows.length; index += 1) {
      if (shortTeamId(rows[index].team) === id) return rows[index];
    }
    return null;
  }

  function heading(tag, label) {
    var node = document.createElement(tag);
    node.textContent = label;
    return node;
  }

  function emptyLine(host, message) {
    var node = document.createElement('p');
    node.className = 'empty';
    node.textContent = message;
    host.appendChild(node);
  }

  function renderTeams() {
    var host = el('team-body');
    host.innerHTML = '';
    var row = state.team ? boardRow(state.team) : null;
    if (!row && app.normalizeName(state.query)) return renderResults(host);
    if (state.team && !row) {
      // A club this season does not hold is said plainly, with the way out.
      backButton(host, '\u2190 All teams');
      return emptyLine(host, 'No Division I club in '
        + app.seasonLabel(state.season) + ' has that id.');
    }
    if (row) return renderClub(host, row);
    renderDirectory(host);
  }

  /* What the search box found. A flat list rather than the conference
   * blocks: a reader who has typed a name is looking for one club, and
   * grouping three results under three headings buries them. */
  function renderResults(host) {
    var payload = seasonPayload();
    var found = app.searchTeams((payload && payload.board) || [],
      window.NCAAMBB_TEAMS || {}, state.query, 25);
    var line = document.createElement('p');
    line.className = 'empty';
    line.textContent = found.length
      ? found.length + (found.length === 1 ? ' club matches ' : ' clubs match ')
        + '\u201c' + state.query + '\u201d.'
      : 'No club matches \u201c' + state.query + '\u201d.';
    host.appendChild(line);
    if (!found.length) return;
    var block = document.createElement('div');
    block.className = 'directory';
    var list = document.createElement('ul');
    found.forEach(function (row) {
      var item = document.createElement('li');
      item.appendChild(teamLink(row.team));
      var rating = document.createElement('span');
      rating.className = 'rating';
      rating.textContent = app.ratingText(row.rating);
      item.appendChild(rating);
      list.appendChild(item);
    });
    block.appendChild(list);
    host.appendChild(block);
  }

  function backButton(host, label) {
    var paragraph = document.createElement('p');
    paragraph.className = 'back';
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'link';
    button.textContent = label;
    button.addEventListener('click', function () {
      state.team = null;
      writeTeam(null);
      render();
    });
    paragraph.appendChild(button);
    host.appendChild(paragraph);
  }

  /* Every Division I club this season, by conference. Ordered by rating
   * inside a conference rather than alphabetically: the board is the one
   * ordering this site has, and repeating it here keeps the two agreeing. */
  function renderDirectory(host) {
    var payload = seasonPayload();
    var rows = (payload && payload.board) || [];
    if (!rows.length) {
      return emptyLine(host, 'No teams are loaded for this season.');
    }
    var order = [];
    var groups = {};
    rows.forEach(function (row) {
      var name = row.conference || 'Independent';
      if (!groups[name]) { groups[name] = []; order.push(name); }
      groups[name].push(row);
    });
    order.sort();
    order.forEach(function (name) {
      var block = document.createElement('div');
      block.className = 'directory';
      block.appendChild(heading('h3', name));
      var list = document.createElement('ul');
      groups[name].forEach(function (row) {
        var item = document.createElement('li');
        item.appendChild(teamLink(row.team));
        var rating = document.createElement('span');
        rating.className = 'rating';
        rating.textContent = app.ratingText(row.rating);
        item.appendChild(rating);
        list.appendChild(item);
      });
      block.appendChild(list);
      host.appendChild(block);
    });
  }

  function renderClub(host, row) {
    // A reader who searched gets back to their results, not to the whole
    // directory they never asked for.
    backButton(host, app.normalizeName(state.query)
      ? '\u2190 Search results' : '\u2190 All teams');
    var payload = seasonPayload();
    var rows = app.teamSchedule((payload && payload.games) || [], row.team);
    var head = document.createElement('div');
    head.className = 'clubhead';
    var block = document.createElement('div');
    var title = heading('h2', '');
    title.appendChild(named(row.team, teamName(row.team)));
    title.classList.add('clubtitle');
    block.appendChild(title);
    var sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = [row.conference, app.seasonLabel(state.season),
                       '#' + row.rank + ' of ' + (payload.board || []).length]
      .filter(Boolean).join(' \u00b7 ');
    block.appendChild(sub);
    head.appendChild(block);
    var figure = document.createElement('div');
    figure.className = 'num';
    // The board's record, not the schedule's: the board counts the season
    // the ratings were built from, and two numbers for one thing on one
    // screen is a bug report waiting to be filed.
    figure.textContent = app.ratingText(row.rating) + ' \u00b7 '
      + row.wins + '-' + row.losses;
    head.appendChild(figure);
    host.appendChild(head);
    if (!rows.length) {
      emptyLine(host, 'This club has no games in '
        + app.seasonLabel(state.season) + '.');
      // Still show who is on it. A club whose season has not started has a
      // roster, and 353 of them were in exactly that position two days into
      // 2026-27.
      return renderRoster(host, row.team);
    }
    host.appendChild(heading('h3', 'Season'));
    var scroller = document.createElement('div');
    scroller.className = 'scroller';
    var table = document.createElement('table');
    table.innerHTML = '<thead><tr><th>Date</th><th>Opponent</th>'
      + '<th>Result</th></tr></thead><tbody></tbody>';
    var body = table.querySelector('tbody');
    rows.forEach(function (entry) {
      var tr = document.createElement('tr');
      var when = document.createElement('td');
      when.textContent = app.dayOf(entry.game) || 'TBD';
      tr.appendChild(when);
      var against = document.createElement('td');
      var at = document.createElement('span');
      at.className = 'sub';
      // A neutral-site game is neither: saying "vs" would put a Final Four
      // in a club's home record as far as a reader is concerned.
      at.textContent = entry.neutral ? 'N ' : (entry.home ? 'vs ' : '@ ');
      against.appendChild(at);
      against.appendChild(teamLink(entry.opponent));
      tr.appendChild(against);
      var result = document.createElement('td');
      var scored = entry.points !== null && entry.points !== undefined
        && entry.against !== null && entry.against !== undefined;
      var score = entry.points + '\u2013' + entry.against;
      // A score with no verdict is a level score, which basketball's
      // overtime makes impossible: the number is reported, the result is
      // not invented.
      result.textContent = entry.result ? entry.result + ' ' + score
        : (scored ? score : app.statusLine(entry.game));
      tr.appendChild(result);
      body.appendChild(tr);
    });
    scroller.appendChild(table);
    host.appendChild(scroller);
    renderRoster(host, row.team);
  }

  function renderDays() {
    var host = el('days');
    host.innerHTML = '';
    // The strip centres on the selected day; only the real today is
    // labelled Today, which is a different question from where the centre is.
    app.dayStrip(state.day, 3, today()).forEach(function (entry) {
      var button = document.createElement('button');
      button.type = 'button';
      button.textContent = entry.today ? 'Today' : entry.day.slice(5);
      button.setAttribute('aria-pressed', String(entry.day === state.day));
      button.addEventListener('click', function () {
        state.day = entry.day;
        render();
      });
      host.appendChild(button);
    });
  }

  function renderFilters() {
    var host = el('filters');
    host.innerHTML = '';
    [['all', 'All'], ['live', 'Live'], ['upcoming', 'Upcoming'],
     ['final', 'Final']].forEach(function (pair) {
      var button = document.createElement('button');
      button.type = 'button';
      button.textContent = pair[1];
      button.setAttribute('aria-pressed', String(state.filter === pair[0]));
      button.addEventListener('click', function () {
        state.filter = pair[0];
        render();
      });
      host.appendChild(button);
    });
  }

  /* The order of a night's card. Default is the best games, because a
   * Division I evening holds three hundred of them and tip-off order puts
   * the ones nobody chose to watch at the top. Tip-off order stays one tap
   * away: a reader following a particular game wants the clock, not a
   * ranking. Both are the same games -- this control never filters.
   */
  function renderSorts() {
    var host = el('sorts');
    host.innerHTML = '';
    [['best', 'Best games'], ['tipoff', 'Tip-off']].forEach(function (pair) {
      var button = document.createElement('button');
      button.type = 'button';
      button.textContent = pair[1];
      button.setAttribute('aria-pressed', String(state.sort === pair[0]));
      button.addEventListener('click', function () {
        state.sort = pair[0];
        render();
      });
      host.appendChild(button);
    });
  }

  function renderCards() {
    var host = el('cards');
    host.innerHTML = '';
    var payload = seasonPayload();
    var games = app.sortGames(
      app.filterGames(app.gamesOn((payload && payload.games) || [],
                                  state.day), state.filter),
      state.sort, null, app.ratingsOf((payload && payload.board) || []));
    if (!games.length) {
      var empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = 'No games on this day.';
      host.appendChild(empty);
      return;
    }
    games.forEach(function (game) {
      var card = document.createElement('div');
      card.className = 'card';
      var status = document.createElement('div');
      status.className = 'status';
      if (!app.timeKnown(game)) status.classList.add('undecided');
      status.textContent = app.statusLine(game);
      card.appendChild(status);
      [['away', game.away, game.away_points],
       ['home', game.home, game.home_points]].forEach(function (side) {
        var row = document.createElement('div');
        row.className = 'side';
        var name = named(side[1]);
        var points = document.createElement('span');
        points.className = 'pts';
        // A missing score is absent, never a zero and never a clock.
        points.textContent = side[2] === null || side[2] === undefined
          ? '' : side[2];
        row.appendChild(name);
        row.appendChild(points);
        card.appendChild(row);
      });
      var foot = document.createElement('div');
      foot.className = 'foot';
      foot.textContent = [game.venue, game.city, game.state]
        .filter(Boolean).join(' · ');
      card.appendChild(foot);
      host.appendChild(card);
    });
  }

  /* ---- people: the index, a club's roster, a player's career -------- */

  /* The people layer is OPTIONAL and per season. The manifest says which
   * seasons have rosters and box scores at all, which is fewer than the
   * seasons that have ratings: nothing published people until this change,
   * and the archive was fetched for the two newest seasons first. A page that
   * assumed every season had people would draw an empty roster for 2015 and
   * call it a club with no players.
   */
  // Which people contracts this page can read. The payload's SHAPE is
  // versioned separately from the manifest's, and a version this page does
  // not know is treated as no people at all rather than decoded on a guess:
  // version 1 carried no day and no opponent on a line, so reading it here
  // would draw a career log of em dashes and call it the player's record.
  var PEOPLE_VERSIONS = [2];

  function peopleSection() {
    var files = state.manifest && state.manifest.files;
    var section = (files && files.people) || null;
    if (!section) return null;
    return PEOPLE_VERSIONS.indexOf(Number(section.version)) < 0
      ? null : section;
  }

  function peopleSeasons() {
    var section = peopleSection();
    if (!section || !section.seasons) return [];
    return Object.keys(section.seasons)
      .map(function (key) { return parseInt(key, 10); })
      .filter(function (value) { return !isNaN(value); })
      .sort(function (a, b) { return a - b; });
  }

  function hasPeople(season) {
    return peopleSeasons().indexOf(Number(season)) >= 0;
  }

  /* Fetch a people file once, and re-render when it lands.
   *
   * `state.people` remembers every path asked for, including the ones that
   * failed: without that a failed fetch would be retried on every keystroke
   * in the search box.
   */
  function needPeople(paths, after) {
    var pending = (paths || []).filter(function (path) {
      return path && !state.people[path];
    });
    if (!pending.length) return false;
    pending.forEach(function (path) { state.people[path] = 'loading'; });
    Promise.all(pending.map(function (path) {
      return load(BASE + path).then(function () {
        state.people[path] = 'loaded';
      }, function () {
        state.people[path] = 'failed';
        state.peopleError = 'Some player data could not be loaded.';
      });
    })).then(function () {
      // The page may be gone by the time a file lands -- a reader who
      // switched leagues, or a test that closed its window. Touching the
      // document then throws inside a promise, where nothing is watching.
      if (typeof document === 'undefined' || !document) return;
      if (after) after();
      render();
    });
    return true;
  }

  function peoplePath(entry) {
    // The manifest states the path with its version stamp; it is used
    // verbatim, so a stale cached file cannot be served under a new export.
    return typeof entry === 'string' ? entry : null;
  }

  function indexPath() {
    var section = peopleSection();
    return section ? peoplePath(section.index) : null;
  }

  function rosterPath(season) {
    var section = peopleSection();
    var entry = section && section.seasons
      && section.seasons[String(season)];
    return entry ? peoplePath(entry.roster) : null;
  }

  function shardPath(season, providerId) {
    var section = peopleSection();
    var entry = section && section.seasons
      && section.seasons[String(season)];
    if (!entry || !entry.shards) return null;
    var shard = app.peopleShard(providerId, section.shards);
    if (shard === null) return null;
    // Matched by number rather than by position, because a manifest that
    // listed the shards in another order would otherwise serve one player's
    // games under another player's id.
    for (var index = 0; index < entry.shards.length; index += 1) {
      var path = entry.shards[index];
      var name = String(path).split('/').pop().split('?')[0];
      if (name === shard + '.js') return path;
    }
    return null;
  }

  function playerIndex() {
    var people = window.NCAAMBB_PEOPLE;
    return (people && people.players) || {};
  }

  function playerName(providerId) {
    var entry = playerIndex()[String(providerId)];
    return (entry && entry.n) || 'Player ' + providerId;
  }

  function rosterFor(season, teamKey) {
    var rosters = window.NCAAMBB_ROSTERS || {};
    var payload = rosters[season];
    var teams = payload && payload.teams;
    return (teams && teams[teamKey]) || null;
  }

  function playerLink(providerId, label) {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'link';
    button.textContent = label || playerName(providerId);
    button.dataset.player = String(providerId);
    button.addEventListener('click', function () {
      state.player = String(providerId);
      window.scrollTo(0, 0);
      writePlayer(state.player);
      render();
    });
    return button;
  }

  function renderPeople() {
    var host = el('people-body');
    host.innerHTML = '';
    var seasons = peopleSeasons();
    if (!seasons.length) {
      return emptyLine(host, 'This export carries no player data yet.');
    }
    if (needPeople([indexPath()])) {
      return emptyLine(host, 'Loading players\u2026');
    }
    if (state.player) return renderPlayer(host);
    renderPlayerSearch(host, seasons);
  }

  function renderPlayerSearch(host, seasons) {
    var newest = seasons[seasons.length - 1];
    var note = document.createElement('p');
    note.className = 'empty';
    note.textContent = 'Players are loaded for '
      + app.seasonRange(seasons) + '.';
    host.appendChild(note);

    var form = document.createElement('div');
    form.className = 'filters';
    var box = document.createElement('input');
    box.type = 'search';
    box.id = 'player-search';
    box.placeholder = 'Search players\u2026';
    box.value = state.playerQuery;
    box.setAttribute('aria-label', 'Search players');
    box.addEventListener('input', function () {
      state.playerQuery = box.value;
      renderPeople();
      var again = el('player-search');
      if (again) {
        again.focus();
        again.setSelectionRange(again.value.length, again.value.length);
      }
    });
    form.appendChild(box);
    host.appendChild(form);

    if (app.normalizeName(state.playerQuery)) {
      return renderPlayerResults(host);
    }
    renderLeaders(host, newest);
  }

  function renderPlayerResults(host) {
    var found = app.searchPlayers(playerIndex(), state.playerQuery, 25);
    var line = document.createElement('p');
    line.className = 'empty';
    line.textContent = found.length
      ? found.length + (found.length === 1 ? ' player matches '
                                           : ' players match ')
        + '\u201c' + state.playerQuery + '\u201d.'
      : 'No player matches \u201c' + state.playerQuery + '\u201d.';
    host.appendChild(line);
    if (!found.length) return;
    var block = document.createElement('div');
    block.className = 'directory';
    var list = document.createElement('ul');
    found.forEach(function (row) {
      var item = document.createElement('li');
      item.appendChild(playerLink(row.id, row.name));
      var where = document.createElement('span');
      where.className = 'rating';
      where.textContent = [row.hometown, row.state].filter(Boolean).join(', ');
      item.appendChild(where);
      list.appendChild(item);
    });
    block.appendChild(list);
    host.appendChild(block);
  }

  /* The season's leading scorers, so the tab opens on something to read
   * rather than an empty search box.
   *
   * By TOTAL points, with the per-game average beside it. A per-game leader
   * board this early in a season is a list of players who have played once.
   */
  function renderLeaders(host, season) {
    if (needPeople([rosterPath(season)])) {
      return emptyLine(host, 'Loading players\u2026');
    }
    var rosters = (window.NCAAMBB_ROSTERS || {})[season];
    var teams = (rosters && rosters.teams) || {};
    var rows = [];
    Object.keys(teams).forEach(function (teamKey) {
      teams[teamKey].forEach(function (row) {
        if (!row[3]) return;
        rows.push({ id: row[0], team: teamKey, games: row[3],
                    minutes: row[4], points: row[5] });
      });
    });
    rows = rows.filter(function (row) {
      return row.points !== null && row.points !== undefined;
    });
    if (!rows.length) {
      return emptyLine(host, 'No player has a recorded game in '
        + app.seasonLabel(season) + ' yet.');
    }
    rows.sort(function (a, b) {
      if (b.points !== a.points) return b.points - a.points;
      return a.id - b.id;
    });
    host.appendChild(heading('h3', 'Most points, '
      + app.seasonLabel(season)));
    var scroller = document.createElement('div');
    scroller.className = 'scroller';
    var table = document.createElement('table');
    table.innerHTML = '<thead><tr><th class="rk">#</th><th>Player</th>'
      + '<th>Club</th><th class="num">G</th><th class="num">Pts</th>'
      + '<th class="num">Pts/G</th></tr></thead><tbody></tbody>';
    var body = table.querySelector('tbody');
    rows.slice(0, 50).forEach(function (row, index) {
      var tr = document.createElement('tr');
      var rank = document.createElement('td');
      rank.className = 'rk';
      rank.textContent = index + 1;
      tr.appendChild(rank);
      var who = document.createElement('td');
      who.appendChild(playerLink(row.id));
      tr.appendChild(who);
      var club = document.createElement('td');
      club.appendChild(teamLink(row.team));
      tr.appendChild(club);
      [row.games, row.points, app.perGame(row.points, row.games)]
        .forEach(function (value) {
          var td = document.createElement('td');
          td.className = 'num';
          td.textContent = value === null || value === undefined
            ? '\u2014' : value;
          tr.appendChild(td);
        });
      body.appendChild(tr);
    });
    scroller.appendChild(table);
    host.appendChild(scroller);
  }

  /* One player's career, over every season this export carries people for.
   *
   * Loads only that player's own shard per season -- one file of sixteen --
   * which is why the lines are sharded on the player's id.
   */
  function renderPlayer(host) {
    var seasons = peopleSeasons();
    var paths = seasons.map(function (season) {
      return shardPath(season, state.player);
    }).filter(Boolean);
    var back = document.createElement('p');
    back.className = 'back';
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'link';
    button.textContent = '\u2190 All players';
    button.addEventListener('click', function () {
      state.player = null;
      writePlayer(null);
      render();
    });
    back.appendChild(button);
    host.appendChild(back);
    if (needPeople(paths)) {
      return emptyLine(host, 'Loading this player\u2026');
    }
    var entry = playerIndex()[String(state.player)];
    var careers = app.playerSeasons(window.NCAAMBB_PLAYER_GAMES,
                                    state.player);
    var head = document.createElement('div');
    head.className = 'clubhead';
    var block = document.createElement('div');
    block.appendChild(heading('h2', playerName(state.player)));
    if (!entry && !careers.length) {
      host.appendChild(head);
      return emptyLine(host, 'No player in this export has that id.');
    }
    var sub = document.createElement('div');
    sub.className = 'sub';
    var newest = careers[0] || null;
    var club = newest && newest.clubs.length ? newest.clubs[0] : null;
    sub.textContent = [
      club && club.position,
      club && club.jersey ? '#' + club.jersey : null,
      entry && entry.h ? [entry.h, entry.s].filter(Boolean).join(', ') : null
    ].filter(Boolean).join(' \u00b7 ');
    block.appendChild(sub);
    head.appendChild(block);
    host.appendChild(head);

    if (!careers.length) {
      return emptyLine(host, 'This player is on a roster but has no recorded '
        + 'game.');
    }
    careers.forEach(function (career) {
      renderPlayerSeason(host, career);
    });
  }

  function renderPlayerSeason(host, career) {
    var totals = app.playerTotals(career.games);
    host.appendChild(heading('h3', app.seasonLabel(career.season)));
    var line = document.createElement('p');
    line.className = 'empty';
    var clubs = career.clubs.map(function (entry) {
      return entry.team ? teamName(entry.team) : null;
    }).filter(Boolean);
    line.textContent = [
      clubs.length ? clubs.join(' and ') : null,
      totals.games + (totals.games === 1 ? ' game' : ' games'),
      totals.starts ? totals.starts + ' started' : null,
      totals.points === null ? null
        : totals.points + ' points (' + app.perGame(totals.points,
                                                    totals.games) + ' a game)',
      totals.minutes === null ? null
        : totals.minutes + ' minutes'
    ].filter(Boolean).join(' \u00b7 ');
    host.appendChild(line);
    if (!career.games.length) return;
    var scroller = document.createElement('div');
    scroller.className = 'scroller';
    var table = document.createElement('table');
    table.innerHTML = '<thead><tr><th>Date</th><th>Opponent</th>'
      + '<th class="num">Min</th><th class="num">Pts</th></tr></thead>'
      + '<tbody></tbody>';
    var body = table.querySelector('tbody');
    // Every line carries its own day and opponent, so a season whose
    // schedule this page has not loaded is dated all the same. Looking them
    // up in the season payload dated the one loaded season and left the rest
    // of a four-season career a table of em dashes, which is how this was
    // found -- in a browser, against the real export.
    career.games.slice().sort(function (a, b) {
      var da = a.day || '';
      var db = b.day || '';
      if (da !== db) return da < db ? -1 : 1;
      return a.game - b.game;
    }).forEach(function (row) {
      var tr = document.createElement('tr');
      var when = document.createElement('td');
      // A line the provider gave no date for is still shown: the minutes
      // were played either way.
      when.textContent = row.day || '\u2014';
      tr.appendChild(when);
      var against = document.createElement('td');
      if (row.opponent) {
        var at = document.createElement('span');
        at.className = 'sub';
        at.textContent = row.site === 'N' ? 'N '
          : (row.site === 'H' ? 'vs ' : '@ ');
        against.appendChild(at);
        against.appendChild(teamLink(row.opponent));
      } else {
        against.textContent = '\u2014';
      }
      tr.appendChild(against);
      [row.minutes, row.points].forEach(function (value) {
        var td = document.createElement('td');
        td.className = 'num';
        // An unrecorded minute count is absent, never 0: a player who sat on
        // the bench and one whose minutes nobody wrote down are different.
        td.textContent = value === null || value === undefined
          ? '\u2014' : value;
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    scroller.appendChild(table);
    host.appendChild(scroller);
  }

  /* A club's roster, under its schedule. Only for a season that has people:
   * an absent roster is said so rather than drawn as a club with no players.
   */
  function renderRoster(host, teamKey) {
    if (!hasPeople(state.season)) {
      // Saying nothing was worse than saying this. A reader landing on a
      // club in the season being played -- which is where every link lands
      // them -- saw a schedule, no squad, and no hint that a squad exists
      // anywhere, because player files are published for the most recent few
      // seasons only and the season in progress is fetched last.
      var seasons = peopleSeasons();
      if (!seasons.length) return;
      host.appendChild(heading('h3', 'Roster'));
      emptyLine(host, 'Players are not published for '
        + app.seasonLabel(state.season) + ' yet. The most recent squad on'
        + ' record is ' + app.seasonLabel(seasons[seasons.length - 1]) + '.');
      return;
    }
    if (needPeople([indexPath(), rosterPath(state.season)])) {
      host.appendChild(heading('h3', 'Roster'));
      return emptyLine(host, 'Loading the roster\u2026');
    }
    host.appendChild(heading('h3', 'Roster'));
    var rows = rosterFor(state.season, teamKey);
    if (!rows || !rows.length) {
      return emptyLine(host, 'No roster is published for this club in '
        + app.seasonLabel(state.season) + '.');
    }
    var scroller = document.createElement('div');
    scroller.className = 'scroller';
    var table = document.createElement('table');
    // Named, so a test (and a reader of the DOM) can tell a club's roster
    // from its schedule: both are tables inside the same panel.
    table.className = 'roster';
    table.innerHTML = '<thead><tr><th>Player</th><th>Pos</th>'
      + '<th class="num">G</th><th class="num">Min</th>'
      + '<th class="num">Pts</th><th class="num">Pts/G</th></tr></thead>'
      + '<tbody></tbody>';
    var body = table.querySelector('tbody');
    rows.forEach(function (row) {
      var tr = document.createElement('tr');
      var who = document.createElement('td');
      if (row[1]) {
        var jersey = document.createElement('span');
        jersey.className = 'sub';
        jersey.textContent = '#' + row[1] + ' ';
        who.appendChild(jersey);
      }
      who.appendChild(playerLink(row[0]));
      tr.appendChild(who);
      var position = document.createElement('td');
      position.textContent = row[2] || '\u2014';
      tr.appendChild(position);
      [row[3], row[4], row[5], app.perGame(row[5], row[3])]
        .forEach(function (value) {
          var td = document.createElement('td');
          td.className = 'num';
          td.textContent = value === null || value === undefined
            ? '\u2014' : value;
          tr.appendChild(td);
        });
      body.appendChild(tr);
    });
    scroller.appendChild(table);
    host.appendChild(scroller);
  }

  function render() {
    renderMeta();
    renderRefusal();
    var ok = state.verdict && state.verdict.ok;
    el('teams').hidden = !ok || state.tab !== 'teams';
    el('standings').hidden = !ok || state.tab !== 'standings';
    el('people').hidden = !ok || state.tab !== 'people';
    el('scoreboard').hidden = !ok || !(state.tab === 'home'
                                       || state.tab === 'games');
    tabButtons();
    if (!ok) return;
    if (!el('teams').hidden) renderTeams();
    if (!el('standings').hidden) renderBoard();
    if (!el('people').hidden) renderPeople();
    if (!el('scoreboard').hidden) {
      renderDays();
      renderFilters();
      renderSorts();
      renderCards();
    }
  }

  function load(src) {
    return new Promise(function (resolve, reject) {
      var script = document.createElement('script');
      script.src = src;
      script.onload = resolve;
      script.onerror = function () { reject(new Error('failed: ' + src)); };
      document.head.appendChild(script);
    });
  }

  /* Today, in the calendar this export states its game days in.
   *
   * NOT the UTC date. A 7pm Eastern tip-off is already midnight UTC, so for
   * the whole of every evening the UTC date is tomorrow -- and reading it as
   * today opened the scoreboard on the next day's schedule while the games
   * on it were being played.
   */
  function today() {
    return app.todayKey(undefined, app.NCAAMBB_DAY_ZONE);
  }

  function openingDay(payload) {
    // Today, clamped into the loaded season. Not the last date in the
    // payload: a published schedule runs to April, so that opened on the
    // championship and the strip called it Today.
    return app.openingDay(
      ((payload && payload.games) || []).map(app.dayOf).filter(Boolean),
      today());
  }

  function start() {
    leagueButtons();
    var opening = tabFromHash();
    if (opening) state.tab = opening;
    state.team = teamIdFromHash();
    state.player = playerIdFromHash();
    window.addEventListener('hashchange', function () {
      var changed = false;
      var next = tabFromHash();
      if (next && next !== state.tab) { state.tab = next; changed = true; }
      // The club is read from the URL and nowhere else, so a link and the
      // back button cannot disagree about which club is open.
      var club = teamIdFromHash();
      if (club !== state.team) { state.team = club; changed = true; }
      var person = playerIdFromHash();
      if (person !== state.player) { state.player = person; changed = true; }
      if (changed) render();
    });
    fetch(BASE + 'manifest.json', { cache: 'no-store' })
      .then(function (response) {
        if (!response.ok) throw new Error('no manifest');
        return response.json();
      })
      .then(function (manifest) {
        state.manifest = manifest;
        state.verdict = loader.accept(manifest);
        if (!state.verdict.ok) {
          render();
          return null;
        }
        state.season = manifest.latest_season;
        var sources = [loader.fileSource(manifest, 'teams', BASE),
                       loader.seasonSource(manifest, state.season, BASE)]
          .filter(Boolean);
        return Promise.all(sources.map(load));
      })
      .then(function () {
        if (!state.verdict || !state.verdict.ok) return;
        state.day = openingDay(seasonPayload());
        render();
      })
      .catch(function (error) {
        state.verdict = {
          ok: false,
          reasons: ['The basketball export could not be loaded: '
                    + error.message],
          stale: true,
          age: { label: 'last updated: unknown', known: false, minutes: null }
        };
        render();
      });
  }

  start();
}());
</script>
</body>
</html>
